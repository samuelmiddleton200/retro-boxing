<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- no zooming; the game fills the screen -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- opened from the home screen: no Safari bars, black status bar -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent: the page always runs under the status bar area, so iOS has no bar-sized strip to
     leave behind when the app opens sideways (the game already keeps clear of the notch itself) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retro Boxing">
<meta name="theme-color" content="#0b0926">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}   /* no bounce, no double-tap zoom */
  /* like an app: the page itself never moves; long menus scroll inside the game area.
     The page is pinned to the screen (position:fixed) so it cannot sit scrolled or pushed off to one side, and its
     height comes from --app-h, the size the script below measures, because an iPhone opened sideways sometimes
     hands the page a stale size or offset for a moment (the "whole screen shifted over" launch). */
  html,body{position:fixed;left:0;top:0;width:100%;height:100%;height:var(--app-h,100%);overflow:hidden}
  #ui{height:100%;height:100dvh;height:var(--app-h,100dvh);min-height:0 !important;overflow:hidden;overscroll-behavior:none}
  #game{height:var(--app-h,100%);bottom:auto !important}
  /* the stats list is the only screen allowed to scroll, and only up and down */
  #ui[data-screen="rankings"],#ui[data-screen="log"],#ui[data-screen="schedule"],#ui[data-screen="mail"]{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
</style>
<script>
  // Launch guard for the shifted screen: measure the real screen, pin the page to it, put the page back at 0,0,
  // and if the iPhone is still reporting a stale size make it measure again. Runs at launch, a few more times in
  // the first seconds, and whenever the app comes back, rotates or resizes. It never reloads the app.
  (function(){
    var root = document.documentElement, nudges = 0, last = '';
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = function(){ return navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches); };
    var angle = function(){ var a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : window.orientation; return typeof a === 'number' ? Math.abs(a) % 180 : null; };
    // what the screen really is: on an iPhone home-screen app that is the whole display, turned the way the phone is held
    function real(){
      var w = window.innerWidth, h = window.innerHeight, a = angle();
      if (ios && standalone() && a !== null && screen.width && screen.height) {
        var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
        var ew = a === 90 ? long : short, eh = a === 90 ? short : long;
        // only a big gap is a stale size (the page still thinks the phone is the other way up); small gaps are real bars
        if (Math.abs(w - ew) > 60 || Math.abs(h - eh) > 60) return { w:ew, h:eh, stale:true };
      }
      return { w:w, h:h, stale:false };
    }
    function settle(){
      try {
        var r = real(), vv = window.visualViewport;
        root.style.setProperty('--app-h', r.h + 'px');
        var moved = window.scrollX || window.scrollY || root.scrollTop || (document.body && document.body.scrollTop) || (vv && (vv.offsetTop || vv.offsetLeft || vv.pageTop || vv.pageLeft));
        if (moved) { window.scrollTo(0, 0); root.scrollTop = 0; if (document.body) document.body.scrollTop = 0; }
        if ((r.stale || moved) && nudges < 6) {                      // make the iPhone lay the page out again
          nudges++;
          var m = document.querySelector('meta[name=viewport]'), c = m && m.getAttribute('content');
          if (m) { m.setAttribute('content', c + ', height=device-height'); setTimeout(function(){ m.setAttribute('content', c); }, 60); }
        }
        var key = r.w + 'x' + r.h + (r.stale ? 's' : '') + (moved ? 'm' : '');
        if (key !== last) { last = key; setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 80); }   // the game re-fits its court
      } catch (e) {}
    }
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    settle();
    [0, 60, 150, 300, 600, 1000, 1600, 2500, 4000].forEach(function(ms){ setTimeout(settle, ms); });
    ['DOMContentLoaded', 'load', 'pageshow', 'resize', 'orientationchange', 'focus'].forEach(function(ev){ window.addEventListener(ev, function(){ settle(); setTimeout(settle, 250); setTimeout(settle, 700); }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) { nudges = 0; settle(); setTimeout(settle, 250); setTimeout(settle, 700); } });
    if (window.visualViewport) { visualViewport.addEventListener('resize', settle); visualViewport.addEventListener('scroll', settle); }
  })();
</script>
<script>
  // No surprise updates: the app never reloads itself. A new version (only when we publish one) shows the
  // next time the app is closed and opened again, because the game loads fresh from the server at launch.
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).catch(() => {}));
</script>
<title>Retro Boxing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --blue:#2c2670; --blue-d:#231e5c; --blue-dd:#19154a; --navy:#0b0926;
  --white:#ffffff; --yellow:#ffd23f; --red:#e24b3b; --green:#44c45d; --sky:#4db8ff; --muted:#d8d4ff;
  --px:"Silkscreen","Courier New",monospace;
  --numf:"Roboto Mono",ui-monospace,Consolas,monospace;
  --body:"Pixelify Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cb:72px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--blue);color:var(--white);height:100%}
body{margin:0;font:15px/1.3 var(--body);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#ui{max-width:980px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-block:10px 16px;min-height:100%}

/* --- chrome --- */
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin-bottom:10px}
.bar>:last-child{justify-self:end}
.box{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:4px 10px;font-family:var(--px);font-weight:700;font-size:14px;white-space:nowrap}
.title{font-family:var(--px);font-weight:700;font-size:clamp(18px,3.4vw,28px);text-align:center;text-transform:uppercase;line-height:1.05;text-shadow:0 3px 0 var(--navy)}
.btn{font-family:var(--px);font-weight:700;text-transform:uppercase;border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:9px 14px;font-size:14px;letter-spacing:.03em;box-shadow:0 4px 0 var(--navy)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.btn.go{background:var(--yellow);color:#241a00;border-color:#fff3b8}
.btn.red{background:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px;border-width:2px}
.btn:disabled{opacity:.4;pointer-events:none}
.panel{border:3px solid var(--white);border-radius:6px;background:var(--blue-d);padding:10px 12px}
.label{font-family:var(--px);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:10px}
.muted{color:var(--muted)}
.yellow{color:var(--yellow)} .good{color:#7dff95} .bad{color:#ffb3aa}
.num{font-family:var(--numf);font-variant-numeric:tabular-nums;font-weight:700}
.px{font-family:var(--px)}
img.pt{image-rendering:pixelated;display:block}

/* --- title --- */
.logo{font-family:var(--px);font-weight:700;font-size:clamp(34px,7vw,64px);text-align:center;line-height:1;margin:18px 0 4px;text-shadow:0 5px 0 var(--navy)}
.logo b{color:var(--yellow)}
.sub{text-align:center;font-family:var(--px);font-size:12px;color:var(--muted);margin-bottom:18px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.slot{border:3px solid var(--white);border-radius:6px;background:var(--blue-d);padding:10px;text-align:center;box-shadow:0 4px 0 var(--navy);display:grid;justify-items:center;gap:4px;position:relative;min-height:150px;align-content:center}
.slot:active{transform:translateY(2px)}
.slot .nm{font-family:var(--px);font-size:14px}
.slot .del{position:absolute;right:6px;top:6px}

/* --- create --- */
.create{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px}
.preview{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);display:grid;place-items:center;padding:6px}
.field{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:8px}
.field input{width:100%;background:var(--navy);color:#fff;border:3px solid var(--white);border-radius:6px;padding:6px 8px;font-family:var(--px);font-size:14px;text-transform:uppercase}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border:3px solid rgba(255,255,255,.35);border-radius:6px;padding:0}
.sw button.on{border-color:var(--yellow);box-shadow:0 0 0 2px var(--navy)}

/* --- hub --- */
.hub{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;min-height:calc(100vh - 80px);min-height:calc(100dvh - 80px)}
.hub>.panel{display:grid;align-content:space-between}
.me{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.me .face{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);overflow:hidden}
.me .face img{width:100%;height:auto}
.me h2{font-family:var(--px);font-size:20px;margin:0;line-height:1.05}
.nick{font-family:var(--px);font-size:11px;color:var(--yellow)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:6px;font-size:14px}
.facts span{color:var(--muted)}
.belt{margin-top:8px;font-family:var(--px);font-size:12px;color:#241a00;background:var(--yellow);border-radius:4px;padding:3px 6px;text-align:center}
.rats{display:grid;gap:7px;margin-top:10px}
.rat{display:grid;grid-template-columns:84px minmax(0,1fr) 34px;align-items:center;gap:8px}
.rat b{font-family:var(--numf);font-size:15px;text-align:right}
.menu{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.4fr 1fr 1fr auto;gap:10px}
.menu .btn{padding:14px 6px}
.menu .wide{grid-column:1/-1}
.nextup{font-size:13px;color:var(--muted);text-align:center;margin-top:2px}

/* --- offers --- */
.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.offer{border:3px solid var(--white);border-radius:6px;background:var(--blue-d);padding:0;overflow:hidden;box-shadow:0 4px 0 var(--navy);text-align:center}
.offer:active{transform:translateY(2px)}
.offer .top{background:var(--blue-dd);display:flex;justify-content:center;padding-top:4px;position:relative}
.offer .rk{position:absolute;left:6px;top:5px;font-family:var(--numf);font-weight:700;font-size:14px}
.offer .tag{position:absolute;right:6px;top:6px;font-family:var(--px);font-size:9px;background:rgba(0,0,0,.35);border-radius:3px;padding:1px 4px}
.offer .bot{border-top:3px solid var(--white);padding:6px 6px 8px}
.offer .nm{font-family:var(--px);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offer .ln{display:flex;justify-content:space-between;font-size:13px;margin-top:2px}
.offer .ln span{color:var(--muted)}
.offer.title{border-color:var(--yellow)}
.offer.title .rk{color:var(--yellow)}

/* --- tale of the tape --- */
.tape{display:grid;grid-template-columns:130px minmax(0,1fr) 150px;gap:12px;align-items:center}
.tape .side{text-align:center}
.tape .side .face{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);display:flex;justify-content:center;overflow:hidden}
.tape .side .nm{font-family:var(--px);font-size:13px;margin-top:4px}
.tt{display:grid;grid-template-columns:44px minmax(0,1fr) 70px minmax(0,1fr) 44px;align-items:center;gap:6px;margin-bottom:6px}
.tt .v{font-family:var(--numf);font-weight:700;font-size:14px}
.tt .v.r{text-align:right}
.tt .k{font-family:var(--px);font-size:10px;text-align:center;color:var(--muted)}
.tt .bl{height:10px;background:var(--navy);border-radius:2px;overflow:hidden;display:flex;justify-content:flex-end}
.tt .br{height:10px;background:var(--navy);border-radius:2px;overflow:hidden}
.tt i{display:block;height:100%}
.tline{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-top:2px solid rgba(255,255,255,.12)}
.tline span:nth-child(2){font-family:var(--px);font-size:10px;color:var(--muted);align-self:center}

/* --- story --- */
.story{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;align-items:center;min-height:calc(100dvh - 40px)}
.story .face{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);overflow:hidden}
.story .face img{width:100%;height:auto}
.story .who{font-family:var(--px);font-size:13px;color:var(--yellow);margin-bottom:6px}
.story .say{font-size:clamp(18px,3.4vw,26px);line-height:1.3;min-height:3.9em}
.story .say.news{font-family:var(--px);font-size:clamp(15px,2.6vw,20px);line-height:1.5;color:var(--muted)}
.story .dots{display:flex;gap:6px;margin-top:10px}
.story .dots i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.25)}
.story .dots i.on{background:var(--yellow)}
.bubble{position:relative;background:#f4f4f4;color:#1d1d1d;border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.25;margin-top:8px}
.bubble::before{content:'';position:absolute;top:-8px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:8px solid #f4f4f4;border-top:0}
.paper{background:#efe8d4;color:#1d1d1d;border-radius:4px;padding:8px 16px 10px;max-width:560px;width:100%;box-shadow:0 5px 0 var(--navy);transform:rotate(-1deg)}
.paper .mast{font-family:var(--px);font-size:11px;display:flex;justify-content:space-between;border-bottom:2px solid #1d1d1d;padding-bottom:3px;margin-bottom:5px}
.paper .head{font-family:var(--px);font-weight:700;font-size:clamp(17px,3.4vw,26px);line-height:1.1}
.paper .deck{font-size:14px;margin-top:4px;color:#3a3a3a}
.offer .tag.grudge{background:var(--red);color:#fff}
.offer.grudge{border-color:var(--red)}

/* --- training --- */
.trow{display:grid;grid-template-columns:96px minmax(0,1fr) 40px auto auto;align-items:center;gap:8px;margin-bottom:6px}
.trow .nm{font-family:var(--px);font-size:13px}
.trow .ds{font-size:12px;color:var(--muted);grid-column:1/-1;margin:-4px 0 4px}
.hbar{height:14px;background:var(--navy);border-radius:2px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:2px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--px);font-size:10px;color:var(--muted);text-align:right;padding:4px;font-weight:400}
td{padding:4px;text-align:right;border-top:2px solid rgba(255,255,255,.13)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr.meRow td{color:var(--yellow)}
tr.champ td{color:#fff3b8}

/* --- result --- */
.res{text-align:center;display:grid;gap:8px;justify-items:center;padding-top:8px}
.res h1{font-family:var(--px);font-size:clamp(34px,7vw,58px);margin:0;line-height:1;text-shadow:0 5px 0 var(--navy)}
.res .how{font-family:var(--px);font-size:14px;color:var(--muted)}
.res .lines{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:16px;margin:6px 0}
.res .lines span{color:var(--muted);text-align:right}
.res .lines b{text-align:left}

/* --- calendar hub --- */
.bar.slim{margin-bottom:6px}
#ui[data-screen="hub"]{display:flex;flex-direction:column;height:100vh;height:100dvh}
.hub2{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:12px;flex:1;min-height:0}
.hub2 .left{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;min-height:0}
.hub2 .right{display:flex;flex-direction:column}
.cal{position:relative;background:#f4efe0;color:#1d1d1d;border-radius:4px;padding:14px 10px 8px;box-shadow:0 5px 0 var(--navy);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.cal .rings{position:absolute;top:-7px;left:0;right:0;display:flex;justify-content:space-around}
.cal .rings i{width:10px;height:16px;border-radius:5px;background:#9a9aa8;border:2px solid #555}
.cal .mh{font-family:var(--px);font-weight:700;font-size:16px;color:#c42d2d;text-align:center;border-bottom:2px solid #1d1d1d;padding-bottom:3px;margin-bottom:4px}
.cal .mh span{color:#1d1d1d}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(0,1fr);min-height:0;gap:2px;font-family:var(--numf);font-size:12px}
.cal .dh{font-family:var(--px);font-size:9px;text-align:center;color:#666}
.cal .cd{position:relative;display:grid;place-items:center;border:1px solid #d8d0bc;min-height:0}
.cal .cd.past span{opacity:.35}
.cal .cd.past::after{content:'';position:absolute;inset:2px;background:linear-gradient(45deg,transparent 45%,#c42d2d 45%,#c42d2d 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,#c42d2d 45%,#c42d2d 55%,transparent 55%);opacity:.5}
.cal .cd.today{background:#ffd23f;font-weight:700}
.cal .cd.fight::before{content:'';position:absolute;inset:-2px 0;border:3px solid #e01b1b;border-radius:50%}
.cal .cd.rv span{text-decoration:underline;text-decoration-color:#c42d2d;text-decoration-thickness:2px}
.cal .bigf{font-size:11px;text-align:left;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvchip{background:#c42d2d;color:#fff;font-size:9px;padding:0 4px;border-radius:3px;font-weight:700}
.cal .cd.tf span{text-decoration:underline;text-decoration-color:#c99a12;text-decoration-thickness:2px}
.cal .cd.bd span::after{content:'*';color:#c42d2d}
.next{font-size:13px;text-align:center}
.notes{background:var(--blue-dd);border:2px solid var(--yellow);border-radius:6px;padding:5px 8px;margin-bottom:6px;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.notes div{flex:1}
.mecard{display:flex;gap:10px;align-items:center}
.mecard .face{border:3px solid #fff;border-radius:6px;background:var(--blue-dd);overflow:hidden;flex:none}
.mecard .nm{font-family:var(--px);font-size:15px}
.fatrow{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center;margin-top:4px}
.fatrow .hbar{height:10px}
.ails{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.ail{font-family:var(--px);font-size:9px;padding:2px 5px;border-radius:3px;background:#6a6a2a}
.ail.t1{background:#8a6a1a} .ail.t2{background:#b8451f} .ail.t3{background:#c41e1e}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto}
.acts .btn{padding:8px 4px;font-size:12px}
.acts .big{padding:14px 4px;font-size:15px}
.acts .wide{grid-column:1/-1}
.badge2{background:var(--red);border-radius:8px;padding:0 5px;font-family:var(--numf)}
.beltchip{font-family:var(--px);font-size:9px;background:var(--yellow);color:#241a00;border-radius:3px;padding:1px 4px;vertical-align:2px}
.rdesc{font-size:12px;color:var(--muted);margin:-5px 0 3px 92px}
/* --- training / rest --- */
.dcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dcard{border:3px solid #fff;border-radius:6px;background:var(--blue-d);padding:8px 6px;text-align:left;display:flex;flex-direction:column;gap:5px;box-shadow:0 4px 0 var(--navy);min-height:180px}
.dcard:active{transform:translateY(2px)}
.dcard .nm{font-family:var(--px);font-size:12px;color:var(--yellow)}
.dcard .ds{font-size:12px;line-height:1.2;color:var(--muted)}
.dcard .gn{display:grid;gap:1px;font-size:12px}
.dcard .ft{font-family:var(--px);font-size:9px;color:#ffb3aa;margin-top:auto}
.dcard.lock{opacity:.45}
.fatmini b{font-size:15px}
.restgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px}
.rcards{display:grid;gap:5px;margin-top:4px}

    if (key === 'iceberg') { f.w = 31; f.l = 0; f.ko = 31; }

const rankOf = id => G.ladder.indexOf(id);

// the winner takes the loser's spot if he was ranked below him; everyone in between moves down one
function beat(win, lose){
  const L = G.ladder, li = L.indexOf(lose); let wi = L.indexOf(win);
  if (li < 0 || (wi >= 0 && wi < li)) return;
  if (wi >= 0) L.splice(wi, 1);
  G.pool = G.pool.filter(x => x !== win);
  L.splice(li, 0, win);
  while (L.length > 31) { const out = L.pop(); if (out !== 'me') G.pool.push(out); }
}
function dropMe(n){
  const L = G.ladder, i = L.indexOf('me'); if (i < 0) return;

function simBout(a, b){
  const A = G.fighters[a], B = G.fighters[b]; if (!A || !B) return null;
  const p = 1 / (1 + Math.exp(-(ovr(A) - ovr(B)) / 5));
  if (Math.random() < .06) { A.d++; B.d++; return { draw:true }; }
  const [W, L] = Math.random() < p ? [A, B] : [B, A];
  const ko = Math.random() < .5;
  W.w++; L.l++; if (ko) W.ko++;
  beat(W.id, L.id);
  return { W, L, ko };
}

const note = s => { (G.notes = G.notes || []).push(s); };

// the other fighters' schedule: bouts booked on real dates
function fillCard(){
  const L = G.ladder;
  let guard = 0;
  while (G.card.length < 7 && guard++ < 60) {
    const i = ri(1, 30), j = Math.max(0, i - ri(1, 3)), a = L[i], b = L[j];
    if (!a || !b || a === 'me' || b === 'me' || booked(a) || booked(b) || (j === 0 && Math.random() < .7)) continue;
    G.card.push({ a, b, day:G.day + ri(6, 40), title:j === 0 });
  }
  if (Math.random() < .12 && G.card.filter(c => G.pool.includes(c.a)).length < 2) {
    const p = pick(G.pool), b = L[ri(25, 30)];
    if (p && b && b !== 'me' && !booked(p) && !booked(b)) G.card.push({ a:p, b, day:G.day + ri(5, 30), title:false });
  }
  G.card.sort((x, y) => x.day - y.day);
}
function runCard(){
  const today = G.card.filter(c => c.day <= G.day);
  G.card = G.card.filter(c => c.day > G.day);
  for (const c of today) {
    const r = simBout(c.a, c.b);
    if (r && c.title && r.W && r.W.id !== c.b) note(`NEW CHAMPION: ${r.W.name} ${r.ko ? 'knocks out' : 'beats'} ${r.L.name}.`);
  }
}

const CHALLENGE_LINES = ['Says you\'re all hype and he wants to prove it.', 'Thinks you\'re an easy payday.', 'Wants your spot in the rankings.', 'Called you out on the radio this morning.', 'His manager rang the gym: name the date.'];

const REFUSALS = ['I don\'t fight nobodies.', 'Come back when somebody knows your name.', 'Who? Get in line, kid.', 'My manager says you\'re not worth the purse.', 'Not interested.'];
function callOut(id){
  const f = G.fighters[id], me = rankOf('me'), them = rankOf(id);

  if (his < mine - 6) return { ok:false, msg:`"${pick(REFUSALS)}"` };

/* ---- one day passes ---- */

      const lost = {}; for (const k of RK) { const d = k === 'spd' ? ri(1, 3) : k === 'pow' ? ri(0, 1) : ri(0, 2); me.rat[k] = Math.max(15, me.rat[k] - d); if (d) lost[k] = d; }
      s += ' The body is slowing down: ' + (Object.keys(lost).map(k => RNAME[k] + ' -' + lost[k]).join(', ') || 'no change') + '.';
    }

  }
  if (t.getUTCMonth() === 0 && t.getUTCDate() === 1) {                    // new year: everybody else gets older, the old ones retire

    for (const f of Object.values(G.fighters)) {
      if (f.me || f.rival || f.age < 36 || Math.random() > .4 || booked(f.id)) continue;
      G.ladder = G.ladder.filter(x => x !== f.id); G.pool = G.pool.filter(x => x !== f.id); delete G.fighters[f.id];
      const n = genFighter(rnd(32, 44), ri(20, 24)); n.w = ri(3, 8); n.l = ri(0, 2); n.ko = Math.round(n.w * .6); G.pool.push(n.id);
    }
    while (G.ladder.length < 31 && G.pool.length) { G.pool.sort((a, b) => ovr(G.fighters[b]) - ovr(G.fighters[a])); G.ladder.push(G.pool.shift()); }
  }
  if (t.getUTCDate() === 1 && G.trainer > 0) {                            // the trainer gets paid on the 1st
    const T = TRAINERS[G.trainer];
    if (G.cash >= T.fee) { G.cash -= T.fee; note(`Paid ${T.name} ${money(T.fee)} for ${MONTH[t.getUTCMonth()]}.`); }
    else { note(`You couldn't pay ${T.name}. He walks out. Sal is back in your corner.`); G.trainer = 0; }
  }
  if (G.day % 7 === 0) for (const f of Object.values(G.fighters)) {     // the rest of the world trains too
    if (f.me) continue;
    for (const k of RK) f.rat[k] = clamp(f.rat[k] + (f.age < 27 ? rnd(0, .5) : f.age > 32 ? -rnd(0, .6) : 0), 15, 99);
  }

  while (G.pool.length < 10) { const n = genFighter(rnd(30, 40)); n.w = ri(2, 9); n.l = ri(2, 10); G.pool.push(n.id); }

  }

}

/* ================= fight terms ================= */
function roundsFor(id, title){ if (title) return 8; const i = rankOf(id); return i < 0 ? 3 : i > 20 ? 4 : i > 10 ? 5 : 6; }
function purseFor(id, title){
  const i = rankOf(id);
  if (i < 0) return ri(5, 9) * 100;
  const base = 300 + 60 * (31 - i) ** 2;
  return Math.round(base * (title ? 2.2 : 1) / 100) * 100;
}

function trainGain(k, q){
  const T = TRAIN[k], me = G.fighters.me, tr = TRAINERS[G.trainer], out = {};
  for (const [r, b] of Object.entries(T.gain)) {
    const dim = clamp(1.4 - me.rat[r] / 100, .3, 1);                       // full gains up to 40, harder near the top
    const v = b * q * (1 + tr.gain) * dim * (1 - G.fat / 200) * (k === 'spar' ? 1 + .15 * Math.max(0, G.gym - 2) : 1);
    me.rat[r] = Math.min(99, me.rat[r] + v); out[r] = v;

}

function heal(rest, act, treats){
  const me = G.fighters.me, A = me.ail, mult = treats.some(t => TREAT[t].mult) ? 2 : 1;
  const f = (rest ? 1.6 : 1) * (1 + GYMS[G.gym].heal) * mult;
  for (const k of Object.keys(A)) {
    let amt = AIL[k].heal * f * ((act && REST[act].heal && REST[act].heal[k]) || 1);
    for (const t of treats) amt += (TREAT[t].fix && TREAT[t].fix[k]) || 0;
    A[k] -= amt; if (A[k] < 1) delete A[k];
  }
}
function restDay(act, treats){
  const before = { fat:G.fat, ail:{ ...G.fighters.me.ail } };
  const cost = treats.reduce((s, t) => s + TREAT[t].cost, 0);
  if (cost > G.cash) return null;
  G.cash -= cost;
  G.fat = Math.max(0, G.fat - REST[act].fat - treats.reduce((s, t) => s + (TREAT[t].fat || 0), 0));
  if (act === 'tape' && G.fight) G.fight.tape = Math.min(3, (G.fight.tape || 0) + 1);
  heal(true, act, treats);

  newDay(); save();
  return before;
}

}

function applyResult(R){
  const me = G.fighters.me, o = G.fighters[R.opp], wasRank = rankOf('me'), wasChamp = wasRank === 0;
  let pay;
  if (R.draw) { me.d++; o.d++; pay = Math.round(R.purse * .75); }
  else if (R.win) {
    me.w++; o.l++; if (R.ko) me.ko++; pay = R.purse;
    beat('me', o.id);
    if (rankOf('me') < 0 && rankOf(o.id) < 0 && ++G.nrWins >= 2) { G.ladder.push('me'); while (G.ladder.length > 31) { const out = G.ladder.splice(G.ladder.length - 2, 1)[0]; G.pool.push(out); } }
    if (R.title) { if (wasChamp) G.defenses++; else G.titles++; }
  } else {
    me.l++; o.w++; if (R.ko) o.ko++; pay = Math.round(R.purse * .5);
    const oi = rankOf(o.id);
    if (oi >= 0 && wasRank >= 0 && oi < wasRank) dropMe(ri(1, 3)); else beat(o.id, 'me');
  }
  G.cash += pay;
  // you carry the damage out of the ring
  me.ail = {};
  for (const [k, v] of Object.entries(R.ail || {})) { const keep = ['eye', 'cut', 'liver'].includes(k) ? .85 : 1; if (v * keep >= 1) me.ail[k] = Math.min(100, v * keep); }
  G.fat = Math.min(100, G.fat + 25);
  const nowRank0 = rankOf('me');
  if (nowRank0 >= 0 && (G.best === null || nowRank0 < G.best)) G.best = nowRank0;
  if (o.rival && G.rivals) {
    const RV = G.rivals[o.rival], D = RIVALS[o.rival];
    if (R.win) { RV.beaten++; if (RV.beaten === 1) storyBeat([[o.rival, pick(D.lose)]], o.rival); }
    else if (RV.beaten) RV.lost++;
    else { RV.lost++; RV.rematchAt = G.day + 21; storyBeat([[o.rival, pick(D.win)], ['news', 'You\'ll get your rematch. Train harder.']], o.rival); }
  }
  R.oppRankIdx = R.oppRankIdxBefore ?? -1;
  G.log.unshift({ day:G.day, opp:o.name, oppRank:R.oppRank, res:R.draw ? 'D' : R.win ? 'W' : 'L', how:R.how, rd:R.rd, title:R.title });
  G.fight = null;
  G.last = { ...R, pay, wasRank, nowRank:rankOf('me'), age:me.age };
  G.last.paper = headline({ ...R, wasRank }, o);
  G.fighters.me.ail = me.ail;
  newDay();
  save();
}
// a sparring round: no record, just training
function applySpar(S){
  const q = clamp(.25 + .5 * S.landed / (S.landed + S.taken + 3) + .25 * S.hpLeft, .15, 1);
  const r = trainGain('spar', q);
  const me = G.fighters.me;
  for (const [k, v] of Object.entries(S.ail || {})) if (v * .4 >= 1) me.ail[k] = Math.min(100, Math.max(me.ail[k] || 0, v * .4));

  newDay(); save();
  return { q, ...r };
}

function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => clamp(Math.round(v * f), 0, 255));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
function mix(a, b, t){
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const c = [16, 8, 0].map(s => Math.round(lerp((A >> s) & 255, (B >> s) & 255, clamp(t, 0, 1))));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}

function arenaScene(W, H, gyU, cxU, halfU){
  const P = PX(W, H, 77), gy = gyU * 2, cx = cxU * 2, half = halfU * 2, top = gy - 20;
  P.dith(0, 0, W, 112, '#06051a', '#141038');
  // the rafters and the light rigs
  P.R(0, 0, W, 2, '#1c1a30'); P.R(0, 9, W, 2, '#1c1a30');
  for (let x = 0; x < W; x += 12) { for (let i = 0; i < 8; i++) P.D(x + i * 1.5, 2 + i, '#1c1a30'); }
  for (const lx of [cx - half * .7, cx - half * .25, cx + half * .25, cx + half * .7].map(Math.round)) {
    P.R(lx - 5, 10, 10, 5, '#0c0b18'); P.R(lx - 4, 14, 8, 2, '#fff6d8'); P.glow(lx, 16, 18, '255,240,200', .35);
  }
  // banners hanging over the crowd on both sides
  for (const [bx, col] of [[6, '#9a1f24'], [W - 30, '#1f3a8a']]) { P.R(bx, 10, 24, 46, col); P.R(bx, 10, 2, 46, shade(col, .75)); P.R(bx, 52, 24, 4, '#f2c14e'); for (let i = 0; i < 24; i += 6) P.R(bx + i, 56, 4, 3, col); P.disc(bx + 12, 28, 6, '#f2c14e'); P.disc(bx + 12, 28, 4, col); P.R(bx + 11, 25, 2, 6, '#f2c14e'); }
  // the barrier in front of the crowd
  P.R(0, 108, W, top - 108, '#0b0926'); P.R(0, 108, W, 4, '#2a2440'); P.R(0, 108, W, 1, '#4a4466');
  for (let x = 8; x < W; x += 30) P.R(x, 112, 2, top - 112, '#1a1630');
  paintRing(P, H, gy, cx, half, '#8a1f2a', 'RETRO BOXING');
  return P.c;
}
// the ring itself: canvas, apron skirt, posts, corner pads and ropes (bg pixels, 2 per world unit)
function paintRing(P, H, gy, cx, half, skirt, label){
  const top = gy - 20, L = cx - half - 20, Wd = (half + 20) * 2, R = L + Wd;
  // ---- the canvas: woven, scuffed, a logo in the middle, a padded lip at the front ----
  P.R(L, top, Wd, 36, '#d8d1bb');
  for (let i = 0; i < Wd * 3; i++) P.D(L + P.ri(0, Wd - 1), top + P.ri(3, 32), P.rnd() < .5 ? '#cfc8b1' : '#e0d9c4');
  for (let y = top + 4; y < top + 32; y += 4) P.x.fillStyle = 'rgba(150,140,115,.08)', P.x.fillRect(L, y, Wd, 1);
  P.R(L, top, Wd, 3, '#b4ad97'); P.R(L, top + 3, Wd, 1, '#c6bfa8');                                        // the far edge
  P.x.fillStyle = 'rgba(0,0,0,.12)'; P.x.fillRect(L, top, 10, 33); P.x.fillRect(R - 10, top, 10, 33);           // the corners fall into shadow
  P.x.fillStyle = 'rgba(160,30,40,.16)'; P.x.beginPath(); P.x.ellipse(cx, top + 18, 64, 11, 0, 0, 7); P.x.fill();
  P.x.fillStyle = '#d8d1bb'; P.x.beginPath(); P.x.ellipse(cx, top + 18, 58, 9, 0, 0, 7); P.x.fill();
  P.x.fillStyle = 'rgba(30,40,110,.14)'; P.x.beginPath(); P.x.ellipse(cx, top + 18, 40, 6, 0, 0, 7); P.x.fill();
  P.x.fillStyle = 'rgba(160,30,40,.2)'; P.x.beginPath(); P.x.moveTo(cx, top + 13); for (let i = 1; i <= 10; i++) { const r = i % 2 ? 4 : 10, an = -Math.PI / 2 + i * Math.PI / 5; P.x.lineTo(cx + Math.cos(an) * r * 2.2, top + 18 + Math.sin(an) * r * .55); } P.x.closePath(); P.x.fill();
  for (let i = 0; i < 34; i++) P.R(L + P.ri(10, Wd - 20), top + P.ri(5, 30), P.ri(2, 9), 1, 'rgba(110,100,80,.2)');   // scuffs
  for (let i = 0; i < 6; i++) P.R(L + P.ri(20, Wd - 30), top + P.ri(8, 28), 2, 1, 'rgba(150,40,40,.18)');           // old blood
  P.x.fillStyle = 'rgba(255,248,225,.2)'; P.x.beginPath(); P.x.ellipse(cx, top + 14, half * .8, 9, 0, 0, 7); P.x.fill();
  P.R(L - 2, top + 32, Wd + 4, 5, '#2a2a3a'); P.R(L - 2, top + 32, Wd + 4, 1, '#5a5a70'); P.R(L - 2, top + 36, Wd + 4, 1, '#14141c');   // padded edge
  // ---- the apron skirt: heavy cloth, folds, piping, the name ----
  const ay = top + 37;
  P.R(L - 4, ay, Wd + 8, H - ay, skirt);
  for (let x = L - 4; x < R + 4; x += 12) { P.R(x, ay, 3, H - ay, shade(skirt, .82)); P.R(x + 3, ay, 1, H - ay, mix(skirt, '#ffffff', .12)); }
  P.R(L - 4, ay, Wd + 8, 2, '#f4f4f4'); P.R(L - 4, ay + 2, Wd + 8, 1, '#a8a8b4'); P.R(L - 4, H - 3, Wd + 8, 3, shade(skirt, .6));
  if (label) for (const tx of [cx - half * .6, cx + half * .6]) { P.text(label, Math.round(tx - P.tw(label) / 2) + 1, ay + 8, shade(skirt, .5)); P.text(label, Math.round(tx - P.tw(label) / 2), ay + 7, '#f4f0e8'); }
  // ---- steps up to the apron at the red corner ----
  { const sx = L - 46, n = 4, sh = Math.max(5, Math.round((H - ay) / n + 1));
    for (let i = 0; i < n; i++) {
      const y = ay - 4 + i * sh, x = sx + (n - 1 - i) * 9, w = L - 4 - x;
      P.R(x, y, w, sh, '#5a5e6a'); P.R(x, y, w, 2, '#b8bcc8'); P.R(x, y + 2, w, 1, '#8a8e9a'); P.R(x, y + sh - 1, w, 1, '#30323a');
      for (let k = x + 3; k < x + w - 2; k += 4) P.D(k, y + 1, '#d8dce6');                                   // grip on the tread
    }
    P.R(sx - 2, ay - 26, 2, H - ay + 26, '#8a8e9a'); P.R(sx - 2, ay - 26, 30, 2, '#b8bcc8'); P.R(sx + 26, ay - 26, 2, 22, '#8a8e9a');   // the handrail
  }
  // ---- posts: steel, a cap, a base plate ----
  const ropeY = [gy - 90, gy - 72, gy - 54, gy - 36], ropeC = ['#e24b3b', '#f4f4f4', '#3f7be0', '#f4f4f4'], pads = ['#c42d2d', '#2f5aa8'];
  [cx - half - 4, cx + half - 4].forEach((x, side) => {
    const pt = gy - 100;
    P.R(x, pt, 10, top - pt + 4, '#9a9aa8'); P.R(x + 1, pt, 2, top - pt + 4, '#e8e8f2'); P.R(x + 3, pt, 2, top - pt + 4, '#c4c4d0'); P.R(x + 7, pt, 2, top - pt + 4, '#7a7a88'); P.R(x + 9, pt, 1, top - pt + 4, '#5a5a66');
    P.R(x - 1, pt - 4, 12, 4, '#d8d8e2'); P.R(x - 1, pt - 4, 12, 1, '#ffffff'); P.R(x, pt - 6, 10, 2, '#b8b8c4');
    P.R(x - 3, top + 1, 16, 3, '#6a6a76'); P.R(x - 3, top + 1, 16, 1, '#a8a8b4');
    // padded turnbuckle covers where each rope meets the post
    for (const ry of ropeY) {
      const c = pads[side];
      P.R(x - 4, ry - 6, 18, 14, shade(c, .55)); P.R(x - 3, ry - 5, 16, 12, c);
      P.R(x - 3, ry - 5, 16, 2, mix(c, '#ffffff', .35)); P.R(x - 1, ry - 4, 4, 1, mix(c, '#ffffff', .6)); P.R(x - 3, ry + 5, 16, 2, shade(c, .7));
      for (let k = x - 2; k < x + 13; k += 2) P.D(k, ry + 3, shade(c, .8));                                  // stitching
    }
  });
  // ---- ropes: rubber-covered, glossy, sagging a little in the middle ----
  const x0 = cx - half + 6, x1 = cx + half - 4;
  ropeY.forEach((y0, i) => {
    const c = ropeC[i], hi = mix(c, '#ffffff', .55), lo = shade(c, .62);
    for (let x = x0; x < x1; x++) {
      const u = (x - cx) / half, y = y0 + Math.round(3 * (1 - u * u));
      P.R(x, y, 1, 5, c); P.D(x, y, lo); P.D(x, y + 1, hi); P.D(x, y + 4, lo);
      if ((x + i * 3) % 7 === 0) P.D(x, y + 2, mix(c, '#ffffff', .25));
      P.x.fillStyle = 'rgba(0,0,0,.18)'; P.x.fillRect(x, y + 5, 1, 1);
    }
  });
  // rope ties: canvas straps binding the ropes together at a third and two thirds of the way
  for (const f of [1 / 3, 2 / 3]) {
    const x = Math.round(cx - half + half * 2 * f), u = (x - cx) / half, sg = Math.round(3 * (1 - u * u));
    P.R(x, ropeY[0] + sg, 4, ropeY[3] - ropeY[0] + 5, '#ecebe4'); P.R(x, ropeY[0] + sg, 1, ropeY[3] - ropeY[0] + 5, '#ffffff'); P.R(x + 3, ropeY[0] + sg, 1, ropeY[3] - ropeY[0] + 5, '#b8b6ac');
    for (const ry of ropeY) P.R(x - 1, ry + sg - 1, 6, 7, '#f4f3ee');
  }
}
// sparring: the same training room as the drills, with a ring set up in it and nobody watching
function sparScene(W, H, gyU, cxU, halfU, lvl){
  const P = PX(W, H, 91);
  P.x.drawImage(gymScene(lvl, W, H), 0, 0);
  paintRing(P, H, gyU * 2, cxU * 2, halfU * 2, ['#3a3a44', '#2f5246', '#1f2a5a', '#1a1d26'][lvl], ['', 'CITY GYM', 'PRO BOXING CLUB', 'ELITE'][lvl]);
  return P.c;
}
// light beams over the crowd, drawn in front of them
function arenaBeams(W, H, cxU, halfU){
  const P = PX(W, H, 3), cx = cxU * 2, half = halfU * 2;
  for (const lx of [cx - half * .7, cx - half * .25, cx + half * .25, cx + half * .7]) {
    for (let i = 0; i < 3; i++) { P.x.fillStyle = 'rgba(255,240,210,.035)'; P.x.beginPath(); P.x.moveTo(lx - 4, 16); P.x.lineTo(lx + 4, 16); P.x.lineTo(cx + (lx - cx) * .3 + 30 - i * 10, H * .8); P.x.lineTo(cx + (lx - cx) * .3 - 30 + i * 10, H * .8); P.x.closePath(); P.x.fill(); }
  }
  return P.c;
}

// ---- walkout robes, hand-painted over the fighter in the 'robe' pose (side view, facing right) ----
// rigRobe(S, T, H, robe): T = torso space, H = head space (both already include the margin)
const ROBE_STYLES = ['satin', 'kimono', 'towel', 'vest', 'cape', 'fur', 'jewel', 'hoodie', 'dragon', 'sarape'];
const ROBE_NAMES = { satin:'Champion satin', kimono:'Short kimono jacket', towel:'Towel over the head', vest:'Sleeveless fringe vest', cape:'High-collar cape',
  fur:'Fur-trimmed king', jewel:'Jeweled shawl robe', hoodie:'Training hoodie + towel', dragon:'Silk dragon kimono', sarape:'Striped sarape poncho' };
function robeRamp(c){ return rampHsl(c, [[-8, .9, .55], [0, 1, 1], [5, .95, 0, .28], [9, .85, 0, .6]]); }
function rigRobe(S, T, H, robe){
  const st = robe.style || 'satin', C = robeRamp(robe.color), R = robeRamp(robe.trim || '#f4f4f4');
  const [d, b, l, hi] = C;
  const hood = (c = C) => {
    S.begin();
    S.poly(c[1], [H(29, 12), H(30, 2), H(37, -2), H(44, -1), H(47, 3), H(46, 7), H(39, 6), H(37, 14), H(33, 19)]);
    S.shade(c[0], [H(29, 4), H(33, 2), H(35, 18), H(30, 15)]); S.shade(c[2], [H(38, -1), H(44, 0), H(45, 3), H(39, 2)]); S.shade(c[3], [H(40, -1), H(43, -1), H(43, 0), H(40, 0)]);
    S.line(c[0], [H(39, 6), H(37, 13)]);
    S.end();
  };
  const body = (len, flare = 2, c = C) => {
    S.poly(c[1], [T(26, 21), T(34, 17), T(42, 19), T(48, 25), T(49, 38), T(48, 52), T(48 + flare, len), T(25 - flare, len), T(24, 54), T(24, 32)]);
    S.shade(c[0], [T(22, 21), T(31, 19), T(32, len), T(20, len)]);
    S.shade(c[2], [T(41, 23), T(46, 25), T(46, len - 6), T(43, len - 6)]);
  };
  const sleeve = (c = C, wide = 0, len = 56) => {
    S.begin();
    S.poly(c[1], [T(30, 23), T(40, 21), T(44, 29), T(45 + wide * .3, 46), T(47 + wide, len), T(36 - wide * .4, len + 1), T(34, 44), T(31, 32)]);
    S.shade(c[0], [T(30, 23), T(33, 23), T(36 - wide * .4, len + 1), T(34, len + 1), T(31, 32)]);
    S.shade(c[2], [T(41, 24), T(43, 29), T(44, 46), T(42, 46)]);
    S.line(c[0], [T(37, 30), T(39, len - 6)]);
    S.end();
  };
  const cuff = (c, len = 56, wide = 0) => { S.begin(); S.poly(c[1], [T(36 - wide * .4, len - 3), T(47 + wide, len - 3), T(47 + wide, len + 1), T(36 - wide * .4, len + 2)]); S.shade(c[2], [T(36, len - 3), T(47 + wide, len - 3), T(47 + wide, len - 2), T(36, len - 2)]); S.end(); };

  if (st === 'satin') {                                         // long satin robe, hood up, wide trim, sash with tails
    S.begin(); body(80);
    for (const x of [29, 36, 44]) S.shade(C[2], [T(x, 24), T(x + 1, 24), T(x + 2, 76), T(x + 1, 76)]);
    S.shade(C[3], [T(44, 26), T(45, 26), T(46, 60), T(45, 60)]);
    S.shade(R[1], [T(45, 21), T(48, 24), T(49, 38), T(48, 52), T(50, 80), T(46, 80), T(45, 50), T(46, 36)]);   // front edge trim
    S.shade(R[2], [T(46, 24), T(47, 25), T(47, 50), T(46, 50)]);
    S.shade(R[1], [T(21, 77), T(51, 77), T(51, 80), T(21, 80)]);
    S.shade(R[1], [T(24, 49), T(50, 49), T(50, 53), T(24, 53)]); S.shade(R[0], [T(24, 52), T(50, 52), T(50, 53), T(24, 53)]);   // sash
    S.end();
    S.begin(); S.poly(R[1], [T(45, 52), T(49, 52), T(51, 68), T(48, 69)]); S.poly(R[1], [T(44, 52), T(46, 53), T(46, 66), T(43, 66)]); S.shade(R[0], [T(44, 60), T(46, 60), T(46, 66), T(43, 66)]); S.end();
    sleeve(C); cuff(R); hood();
  } else if (st === 'kimono') {                                 // cropped at the hip, wide square sleeves, collar band across the chest
    S.begin(); body(62, 1);
    S.shade(R[1], [T(36, 18), T(40, 18), T(48, 34), T(46, 40)]); S.shade(R[2], [T(37, 18), T(38, 18), T(47, 35), T(46, 36)]);
    S.shade(R[0], [T(24, 46), T(49, 46), T(49, 52), T(24, 52)]); S.shade(R[1], [T(24, 47), T(49, 47), T(49, 48), T(24, 48)]);   // wide belt
    for (let y = 24; y < 60; y += 6) for (let x = 26 + (y % 12 ? 3 : 0); x < 46; x += 6) S.dot(C[2], x + 6, y, 2, 1);    // little wave marks

    S.end();
  } else if (st === 'vest') {                                   // sleeveless long vest, fringe at the hem, big star on the back
    S.begin(); body(72, 1);
    S.shade(R[1], [T(44, 20), T(48, 25), T(49, 38), T(48, 52), T(49, 72), T(46, 72), T(46, 50), T(46, 32)]);
    const sx = 30, sy = 36;                                      // the star on the back
    S.shade(R[1], [T(sx, sy - 6), T(sx + 2, sy - 1), T(sx + 6, sy - 1), T(sx + 3, sy + 2), T(sx + 4, sy + 7), T(sx, sy + 4), T(sx - 4, sy + 7), T(sx - 3, sy + 2), T(sx - 6, sy - 1), T(sx - 2, sy - 1)]);

    rigCuff(S, nW, nE); rigGlove(S, T(41, 58)[0], 58, false);
  } else if (st === 'cape') {                                   // a cape from the shoulders, flowing back, tall collar, clasp at the throat
    S.begin();
    S.poly(C[1], [T(28, 18), T(40, 17), T(44, 24), T(38, 30), T(30, 46), T(26, 70), T(28, 86), T(10, 86), T(14, 60), T(20, 36)]);
    S.shade(C[0], [T(10, 86), T(18, 86), T(22, 40), T(20, 36), T(14, 60)]);

  const a = 11, b = 12, dx = A[0] - H[0], dy = A[1] - H[1], d = Math.min(Math.hypot(dx, dy), a + b - .01);
  const ang = Math.atan2(dy, dx), k = Math.acos(Math.max(-1, Math.min(1, (a * a + d * d - b * b) / (2 * a * d))));
  const t = ang - k, Kn = [H[0] + Math.cos(t) * a, H[1] + Math.sin(t) * a];
  const len = Math.hypot(dx, dy), Ax = len > a + b ? [H[0] + dx / len * (a + b - .01), H[1] + dy / len * (a + b - .01)] : A;
  return [Kn, Ax];
}
function drawRunner(g, S, ox, oy){
  const me = G.fighters.me, k = RUN_K, top = S.top !== null && MG.time - S.top > .3;
  const FL = footAt(S, 'L', ox, oy), FR = footAt(S, 'R', ox, oy);
  const Hw = [(FL[0] + FR[0]) / 2 - 1, Math.max(FL[1], FR[1]) - 19 + (S.stumble > 0 ? 2 : 0)];
  const lean = top ? 0 : 4, q = v => Math.round(v);
  // world to body space: the hip sits at (35 + lean / 2, 66)
  const toB = P => [35 + lean * .5 + (P[0] - Hw[0]) / k - 3, 66 + (P[1] - Hw[1]) / k - 7];
  const [fK, fA] = runLeg([32 + lean * .5, 66], toB(FL), false), [nK, nA] = runLeg([38 + lean * .5, 66], toB(FR), true);
  const sw = Math.sin(S.walk), J = { lean, cr:0, hx:S.stumble > 0 ? -2 : 0, hy:0, nK:nK.map(q), nA:nA.map(q), fK:fK.map(q), fA:fA.map(q) };
  if (top) Object.assign(J, { nEl:[41, 16], nWr:[44, 4], nGl:[45, 0], fEl:[31, 16], fWr:[30, 4], fGl:[30, 0] });
  else {
    const arm = (Sh, a) => { const E = [Sh[0] + Math.sin(a) * 14, Sh[1] + Math.cos(a) * 14], f = a + 1.7, W = [E[0] + Math.sin(f) * 12, E[1] + Math.cos(f) * 12]; return [E.map(q), W.map(q), [q(W[0] + Math.sin(f) * 3), q(W[1] + Math.cos(f) * 3)]]; };
    const n = arm([35, 28], Math.round(sw * 4) / 4 * .9), f = arm([33, 27], -Math.round(sw * 4) / 4 * .9);
    Object.assign(J, { nEl:n[0], nWr:n[1], nGl:n[2], fEl:f[0], fWr:f[1], fGl:f[2] });

  drawRig(g, Hw[0] - (35 + lean * .5 - 40) * k, Hw[1] + (95 - 66) * k, 1, 'dyn:' + JSON.stringify(J), look, { hands:true, noShadow:true }, 0, k);
}

      if (m.type === 'news') return `<div class="mrow news"><div class="grow">${esc(m.text)}</div><span class="muted num">${fmtDate(m.day)}</span><button class="btn sm" data-a="dismiss" data-k="${k}">OK</button></div>`;
      const f = G.fighters[m.id]; if (!f) return '';
      return `<div class="mrow ${m.grudge ? 'grudge' : ''} ${m.title ? 'title' : ''}"><div class="face">${face(f, 60)}</div><div class="grow">
        <div class="nm">${esc(f.name)} <span class="muted num">${rankShort(m.id)} &middot; ${rec(f)} &middot; OVR ${ovr(f)}</span> ${m.title ? '<span class="beltchip">TITLE</span>' : m.grudge ? `<span class="ail t3">${m.rematch ? 'REMATCH' : 'GRUDGE'}</span>` : ''}</div>
        <div class="ds">&ldquo;${esc(m.msg)}&rdquo;</div><div class="muted num" style="font-size:12px">${m.rounds} rounds &middot; purse <b class="yellow">${money(m.purse)}</b> &middot; answer by ${fmtDate(m.exp)}</div></div>
        <div class="col"><button class="btn sm go" data-a="accept" data-k="${k}" ${G.fight ? 'disabled' : ''}>Accept</button><button class="btn sm" data-a="decline" data-k="${k}">Decline</button></div></div>`;
    }).join('');
    return `${bar('Mail')}<div class="mail">${items || '<div class="panel muted">No mail. Challenges come in every few days, or call someone out from the rankings.</div>'}</div>`;
  },
  dates(){
    const P = pending, f = G.fighters[P.id];
    const opts = DATE_OPTS.map(n => `<button class="dopt" data-a="pickdate" data-n="${n}"><div class="nm">${n / 7} weeks</div><div class="num">${fmtDate(G.day + n)}</div><div class="muted">${n - 1} days to train</div></button>`).join('');
    return `${bar('Pick the date', '<button class="btn sm" data-a="hub">Cancel</button>')}<div class="panel" style="margin-bottom:10px;text-align:center"><b>${esc(f.name)}</b> agreed. ${P.rounds} rounds, purse <b class="yellow num">${money(P.purse)}</b>${P.title ? ' &middot; <span class="yellow">for the title</span>' : ''}.</div><div class="dopts">${opts}</div>`;
  },
  rankings(){
    const rows = G.ladder.map((id, i) => {
      const f = G.fighters[id];
      return `<tr class="${id === 'me' ? 'meRow' : i === 0 ? 'champ' : ''} ${id !== 'me' ? 'tap' : ''}" ${id !== 'me' ? `data-a="pickfighter" data-k="${id}"` : ''}><td class="num">${i === 0 ? 'C' : i}</td><td class="l">${esc(f.name)}${i === 0 ? ' &#9733;' : ''}${booked(id) && id !== 'me' ? ' <span class="muted">(booked)</span>' : ''}</td><td class="l muted">${f.me ? 'You' : STYLES[f.style].name}</td><td class="num">${rec(f)}</td><td class="num">${f.ko}</td><td class="num">${ovr(f)}</td><td class="num">${f.age}</td></tr>`;
    }).join('');
    const me = G.fighters.me;
    const out = rankOf('me') < 0 ? `<tr class="meRow"><td>NR</td><td class="l">${esc(me.name)}</td><td class="l muted">You</td><td class="num">${rec(me)}</td><td class="num">${me.ko}</td><td class="num">${ovr(me)}</td><td class="num">${me.age}</td></tr>` : '';
    const sheet = calPick ? (() => { const f = G.fighters[calPick]; return `<div class="sheet"><div class="face">${face(f, 60)}</div><div class="grow"><div class="nm">${esc(f.name)} <span class="muted num">${rankShort(calPick)} &middot; ${rec(f)} &middot; OVR ${ovr(f)}</span></div><div class="ds">${callMsg ? callMsg : 'Call him out?'}</div></div><div class="col">${callMsg ? '' : '<button class="btn sm go" data-a="callout">Challenge</button>'}<button class="btn sm" data-a="closesheet">Close</button></div></div>`; })() : '';
    return `${bar('Rankings')}${sheet}<div class="panel"><div class="muted" style="font-size:12px;margin-bottom:4px">Tap a fighter to call him out.</div><table><tr><th>#</th><th class="l">Boxer</th><th class="l">Style</th><th>Record</th><th>KO</th><th>OVR</th><th>Age</th></tr>${rows}${out}</table></div>`;
  },
  schedule(){
    const all = [...G.card.map(c => ({ ...c })), ...(G.fight ? [{ a:'me', b:G.fight.id, day:G.fight.day, title:G.fight.title, mine:true }] : [])].sort((x, y) => x.day - y.day);
    const rows = all.map(c => `<tr class="${c.mine ? 'meRow' : ''}"><td class="l num">${fmtDate(c.day)}</td><td class="l">${esc(G.fighters[c.a].name)} <span class="muted num">${rankShort(c.a)}</span></td><td>vs</td><td class="l">${esc(G.fighters[c.b].name)} <span class="muted num">${rankShort(c.b)}</span></td><td>${c.title ? '<span class="beltchip">TITLE</span>' : ''}</td></tr>`).join('');
    return `${bar('Fight schedule')}<div class="panel"><table><tr><th class="l">Date</th><th class="l"></th><th></th><th class="l"></th><th></th></tr>${rows}</table></div>`;
  },
  team(){
    const gyms = GYMS.map((Gm, k) => `<div class="tm ${k === G.gym ? 'on' : ''}"><div class="grow"><b>${Gm.name}</b><div class="ds">${Gm.desc}</div></div>${k === G.gym ? '<span class="label">Yours</span>' : k < G.gym ? '' : `<button class="btn sm go" data-a="buygym" data-k="${k}" ${G.cash < Gm.cost || k !== G.gym + 1 ? 'disabled' : ''}>${money(Gm.cost)}</button>`}</div>`).join('');
    const trs = TRAINERS.map((T, k) => `<div class="tm ${k === G.trainer ? 'on' : ''}"><div class="grow"><b>${T.name}</b><div class="ds">${T.desc}</div></div>${k === G.trainer ? '<span class="label">Hired</span>' : `<button class="btn sm ${k ? 'go' : ''}" data-a="hire" data-k="${k}" ${G.cash < T.fee ? 'disabled' : ''}>${T.fee ? money(T.fee) + '/mo' : 'Free'}</button>`}</div>`).join('');
    return `${bar('Team', '<button class="btn sm" data-a="hub">Back</button> <button class="btn sm go" data-a="robe">Robe</button>')}<div class="teamgrid"><div class="panel"><div class="label">Gym (one-time)</div>${gyms}</div><div class="panel"><div class="label">Trainer (paid on the 1st, first month now)</div>${trs}</div></div>`;
  },
  tape(){
    const o = G.fight, me = G.fighters.me, f = G.fighters[o.id];
    const v = x => fl(x);
    const row = k => `<div class="tt"><span class="v num">${v(me.rat[k])}</span><div class="bl"><i style="width:${me.rat[k]}%;background:${barCol(me.rat[k])}"></i></div><span class="k">${RNAME[k]}</span><div class="br"><i style="width:${f.rat[k]}%;background:${barCol(f.rat[k])}"></i></div><span class="v r num">${v(f.rat[k])}</span></div>`;
    const line = (a, k, b) => `<div class="tline"><b class="num">${a}</b><span>${k}</span><b class="num">${b}</b></div>`;
    const sharp = G.restedOn === G.day - 1 && G.fat <= 25;
    return `${bar(o.title ? 'Title fight' : 'Tale of the tape')}
      <div class="tape"><div class="side"><div class="face">${face(me, 124)}</div><div class="nm">${esc(me.name)}</div>${sharp ? '<div class="label good">Sharp: rested and ready</div>' : G.fat > 40 ? '<div class="label bad">Tired</div>' : ''}${o.myGrit ? `<div class="label good">+${o.myGrit} Grit: he moved the date</div>` : ''}</div>
      <div class="panel">${RK.map(row).join('')}
        ${line(rec(me), 'Record', rec(f))}${line(rankShort('me'), 'Rank', rankShort(o.id))}${line(me.age, 'Age', f.age)}
        <div class="row between" style="margin-top:8px"><span class="muted">${o.rounds} rounds &middot; purse <b class="yellow num">${money(o.purse)}</b></span><button class="btn go" data-a="fight">Fight!</button></div></div>
      <div class="side"><div class="face" style="transform:scaleX(-1)">${face(f, 124)}</div><div class="nm">${esc(f.name)}</div><div class="label">${f.nick ? '&ldquo;' + esc(f.nick) + '&rdquo; &middot; ' : ''}${STYLES[f.style].name}</div>${o.theirGrit ? `<div class="label bad">+${o.theirGrit} Grit: you moved the date</div>` : ''}
        <div class="bubble">${esc(o.talk || (o.talk = pick((rivalOf(o.id) || {}).tape || TAUNTS[f.style])))}</div></div></div>`;
  },
  story(){
    const b = G.story[0], k = clamp(storyStep, 0, b.lines.length - 1), [who, text] = b.lines[k];
    const opp = who.startsWith('opp:') ? G.fighters[who.slice(4)] : null;
    const rv = RIVALS[who] || null, f = rv ? G.fighters[G.rivals[who].id] : opp || G.fighters.me;
    const speaker = rv ? `&ldquo;${esc(rv.nick)}&rdquo; ${esc(rv.name)}` : opp ? esc(opp.name) : '&nbsp;';
    const last = k >= b.lines.length - 1, talk = rv || opp;
    return `<div class="story"><div class="face">${f ? face(f, 170) : ''}</div><div>
      <div class="who">${speaker}</div>
      <div class="say ${talk ? '' : 'news'}">${talk ? '&ldquo;' + text + '&rdquo;' : text}</div>
      <div class="row between" style="margin-top:12px"><div class="dots">${b.lines.map((_, j) => `<i class="${j <= k ? 'on' : ''}"></i>`).join('')}</div>
      <button class="btn go" data-a="storynext">${last ? 'Continue' : 'Next'}</button></div></div></div>`;
  },
  robe(){
    const me = G.fighters.me, R = robeOf(me);
    const sw = (act, list, cur) => `<div class="sw">${list.map(c => `<button data-a="${act}" data-v="${c}" class="${cur === c ? 'on' : ''}" style="background:${c}"></button>`).join('')}</div>`;
    const ems = Object.keys(EMBLEMS).map(k => `<button class="emb ${R.emblem === k ? 'on' : ''}" data-a="remb" data-v="${k}">${emblemIcon(k)}</button>`).join('');
    const tiers = ROBE_TIERS.map((T, k) => `<button class="tier ${R.tier === k ? 'on' : ''}" data-a="rtier" data-n="${k}" ${!R.owned.includes(k) && G.cash < T.cost ? 'disabled' : ''}><b>${T.name}</b><span>${R.tier === k ? 'Wearing' : 'Wear it'}</span></button>`).join('');
    return `${bar('Robe', '<button class="btn sm" data-a="team">Back</button>')}<div class="robegrid"><div class="robeprev"><img class="pt" src="${robeImage(me, R)}" alt=""></div>
      <div class="panel robeopts"><div class="field"><span class="label">Robe</span>${sw('rcol', ROBE_COLORS, R.color)}</div>
      <div class="field"><span class="label">Trim</span>${sw('rtrim', TRIMS, R.trim)}</div>
      ${Object.keys(ROBE_CUTS).map(k => `<div class="field"><span class="label">${CUT_LABEL[k]}</span><div class="cuts">${ROBE_CUTS[k].map(([v, nm]) => `<button class="btn sm ${(R[k] || '') === v ? 'go' : ''}" data-a="rcut" data-k="${k}" data-v="${v}">${nm}</button>`).join('')}</div></div>`).join('')}
      <div class="field"><span class="label">Gold piping</span><div class="cuts"><button class="btn sm ${R.tier >= 1 ? 'go' : ''}" data-a="rpipe">${R.tier >= 1 ? 'On' : 'Off'}</button></div></div>
      <div class="field"><span class="label">Trunks</span>${sw('kit', KITS, me.look.trunks)}</div>
      <div class="field"><span class="label">Gloves</span>${sw('glv', GLOVES, me.look.gloves)}</div>
      <div class="muted" style="font-size:12px">Every robe is free.</div></div></div>`;
  },
  spardone(){
    const S = G.lastSpar, ails = ailList(G.fighters.me.ail);
    return `<div class="res"><h1>SPARRING</h1><div class="how">You landed ${S.landed}, took ${S.taken}</div><div>${gainLines(S.gains)}</div>
      <div class="muted num">Fatigue ${S.fat[0].toFixed(0)} &rarr; ${S.fat[1].toFixed(0)}</div>${ails.length ? `<div class="ails" style="justify-content:center">${ails.map(ailChip).join('')}</div>` : ''}
      <button class="btn go" data-a="hub">Next day</button></div>`;
  },
  log(){
    const rows = G.log.map(l => `<tr><td class="${l.res === 'W' ? 'good' : l.res === 'L' ? 'bad' : ''}">${l.res}</td><td class="l num">${l.day !== undefined ? fmtDate(l.day) : ''}</td><td class="l">${esc(l.opp)} <span class="muted num">${l.oppRank}</span>${l.title ? ' <span class="yellow">&#9733;</span>' : ''}</td><td class="l">${HOW[l.how]}</td><td class="num">${l.rd}</td></tr>`).join('');
    return `${bar('Fight log')}<div class="panel">${G.log.length ? `<table><tr><th></th><th class="l">Date</th><th class="l">Opponent</th><th class="l">How</th><th>Rd</th></tr>${rows}</table>` : '<div class="muted">No fights yet.</div>'}</div>`;
  },
  result(){
    const R = G.last, me = G.fighters.me;
    const word = R.draw ? 'DRAW' : R.win ? 'YOU WIN' : 'YOU LOSE';
    const rk = i => i < 0 ? 'Unranked' : i === 0 ? 'Champion' : '#' + i;
    const title = R.title && R.win ? `<div class="belt" style="padding:4px 14px">${R.wasRank === 0 ? 'TITLE DEFENDED' : 'NEW WORLD CHAMPION'}</div>` : '';
    const P = R.paper ? `<div class="paper"><div class="mast"><span>THE DAILY JAB</span><span>${esc(townOf(me)).toUpperCase()} EDITION</span></div><div class="head">${R.paper.h}</div><div class="deck">${R.paper.d}</div></div>` : '';
    const ails = ailList(me.ail);
    return `<div class="res"><h1 class="${R.win ? 'yellow' : ''}">${word}</h1>${P}
      <div class="how">${HOW[R.how]}${R.ko ? ' &middot; round ' + R.rd : ''}${R.totals ? ' &middot; ' + R.totals.map(t => t[0] + '-' + t[1]).join(', ') : ''}</div>${title}
      <div class="lines"><span>Record</span><b class="num">${rec(me)} (${me.ko} KO)</b><span>Purse</span><b class="num yellow">+${money(R.pay)}${R.win || R.draw ? '' : ' (loser\'s half)'}</b><span>Rank</span><b class="num">${rk(R.wasRank)} &rarr; ${rk(R.nowRank)}</b></div>
      ${ails.length ? `<div class="ails" style="justify-content:center">${ails.map(ailChip).join('')}</div>` : ''}
      <button class="btn go" data-a="hub">Continue</button></div>`;
  },
  over(){
    const me = G.fighters.me;
    return `<div class="res"><h1>CAREER OVER</h1><div class="how">${esc(me.name)} hangs up the gloves at ${me.age}</div>
      ${face(me, 110)}
      <div class="lines"><span>Record</span><b class="num">${rec(me)} (${me.ko} KO)</b><span>Best rank</span><b>${G.best === null ? 'Unranked' : G.best === 0 ? 'World champion' : '#' + G.best}</b><span>Title wins</span><b class="num">${G.titles}</b><span>Defenses</span><b class="num">${G.defenses}</b></div>
      <button class="btn go" data-a="title">Back to menu</button></div>`;
  },
};
ui.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, n = +b.dataset.n, k = b.dataset.k;
  if (a !== 'del' && a !== 'retire') armed = null;
  switch (a) {
    case 'title': SLOT = null; G = null; screen = 'title'; break;
    case 'newslot': SLOT = n; draft = { name:'', nick:'', town:'', look:{ skin:SKINS[1], hair:HAIRS[0], trunks:KITS[0], gloves:GLOVES[0] } }; screen = 'create'; break;
    case 'load': SLOT = n; G = slotLoad(n); screen = 'hub'; if (!G) { screen = 'title'; SLOT = null; } else { migrate(); checkStory(); save(); } break;
    case 'del': e.stopPropagation(); if (armed === 'del' + n) { resetSlot(n); armed = null; } else armed = 'del' + n; break;
    case 'look': draft.look[k] = b.dataset.v; break;
    case 'start': { const nm = (draft.name || '').trim() || 'ROOKIE'; newCareer(nm, (draft.nick || '').trim(), { ...draft.look }, (draft.town || '').trim()); save(); screen = 'hub'; break; }
    case 'hub': screen = 'hub'; calPick = null; callMsg = null; break;
    case 'clearnotes': G.notes = []; save(); break;
    case 'me': case 'train': case 'mail': case 'rankings': case 'schedule': case 'team': case 'log': screen = a; calPick = null; callMsg = null; break;
    case 'rest': screen = 'rest'; restPick = 'sleep'; treatPick = new Set(); break;
    case 'restpick': restPick = k; break;
    case 'treat': if (treatPick.has(k)) treatPick.delete(k); else treatPick.add(k); break;
    case 'dorest': if (restDay(restPick, [...treatPick])) { screen = 'hub'; } break;
    case 'drill': if (k === 'spar') { ac(); startSpar(); return; } startMini(k); return;
    case 'tape': screen = 'tape'; break;
    case 'fight': ac(); startFight(G.fight); return;
    case 'postpone': postpone(); screen = 'hub'; break;
    case 'accept': { const m = G.mail[+k]; pending = { id:m.id, title:m.title, grudge:m.grudge, rematch:m.rematch, purse:m.purse, rounds:m.rounds }; screen = 'dates'; break; }
    case 'decline': declineMail(+k); break;
    case 'dismiss': G.mail.splice(+k, 1); save(); break;
    case 'pickdate': bookFight(pending, n); pending = null; screen = 'hub'; break;
    case 'pickfighter': calPick = k; callMsg = null; break;
    case 'closesheet': calPick = null; callMsg = null; break;
    case 'callout': { const r = callOut(calPick); if (r.ok) { pending = r.deal; calPick = null; screen = 'dates'; } else callMsg = r.msg; break; }
    case 'buygym': { const Gm = GYMS[+k]; if (G.cash >= Gm.cost && +k === G.gym + 1) { G.cash -= Gm.cost; G.gym = +k; save(); } break; }
    case 'hire': { const T = TRAINERS[+k]; if (G.cash >= T.fee) { G.cash -= T.fee; G.trainer = +k; save(); } break; }
    case 'robe': screen = 'robe'; break;
    case 'rcol': G.fighters.me.robe.color = b.dataset.v; save(); break;
    case 'rtrim': G.fighters.me.robe.trim = b.dataset.v; save(); break;
    case 'remb': G.fighters.me.robe.emblem = b.dataset.v; save(); break;
    case 'rcut': G.fighters.me.robe[b.dataset.k] = b.dataset.v; save(); break;
    case 'rpipe': { const R = G.fighters.me.robe; R.tier = R.tier >= 1 ? 0 : 1; if (!R.owned.includes(R.tier)) R.owned.push(R.tier); save(); break; }
    case 'kit': G.fighters.me.look.trunks = b.dataset.v; save(); break;
    case 'glv': G.fighters.me.look.gloves = b.dataset.v; save(); break;
    case 'rtier': { const R = G.fighters.me.robe, T = ROBE_TIERS[n]; if (!R.owned.includes(n)) { if (G.cash < T.cost) break; G.cash -= T.cost; R.owned.push(n); } R.tier = n; save(); break; }
    case 'storynext': { const s = G.story[0]; if (storyStep < s.lines.length - 1) storyStep++; else { G.story.shift(); storyStep = 0; save(); screen = 'hub'; } break; }
    case 'retire': if (armed === 'retire') { armed = null; G.over = true; save(); screen = 'hub'; } else armed = 'retire'; break;
  }
  render();
});
render();
})();
</script>
