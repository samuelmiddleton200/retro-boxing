<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- no zooming; the game fills the screen -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- opened from the home screen: no Safari bars, black status bar -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent: the page always runs under the status bar area, so iOS has no bar-sized strip to
     leave behind when the app opens sideways (the game already keeps clear of the notch itself) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retro Boxing">
<meta name="theme-color" content="#0b0926">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}   /* no bounce, no double-tap zoom */
  /* like an app: the page itself never moves; long menus scroll inside the game area.
     The page is pinned to the screen (position:fixed) so it cannot sit scrolled or pushed off to one side, and its
     height comes from --app-h, the size the script below measures, because an iPhone opened sideways sometimes
     hands the page a stale size or offset for a moment (the "whole screen shifted over" launch). */
  html,body{position:fixed;left:0;top:0;width:100%;height:100%;height:var(--app-h,100%);overflow:hidden}
  #ui{height:100%;height:100dvh;height:var(--app-h,100dvh);min-height:0 !important;overflow:hidden;overscroll-behavior:none}
  #game{height:var(--app-h,100%);bottom:auto !important}
  /* the stats list is the only screen allowed to scroll, and only up and down */
  #ui[data-screen="rankings"],#ui[data-screen="log"]{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
</style>
<script>
  // Launch guard for the shifted screen: measure the real screen, pin the page to it, put the page back at 0,0,
  // and if the iPhone is still reporting a stale size make it measure again. Runs at launch, a few more times in
  // the first seconds, and whenever the app comes back, rotates or resizes. It never reloads the app.
  (function(){
    var root = document.documentElement, nudges = 0, last = '';
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = function(){ return navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches); };
    var angle = function(){ var a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : window.orientation; return typeof a === 'number' ? Math.abs(a) % 180 : null; };
    // what the screen really is: on an iPhone home-screen app that is the whole display, turned the way the phone is held
    function real(){
      var w = window.innerWidth, h = window.innerHeight, a = angle();
      if (ios && standalone() && a !== null && screen.width && screen.height) {
        var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
        var ew = a === 90 ? long : short, eh = a === 90 ? short : long;
        // only a big gap is a stale size (the page still thinks the phone is the other way up); small gaps are real bars
        if (Math.abs(w - ew) > 60 || Math.abs(h - eh) > 60) return { w:ew, h:eh, stale:true };
      }
      return { w:w, h:h, stale:false };
    }
    function settle(){
      try {
        var r = real(), vv = window.visualViewport;
        root.style.setProperty('--app-h', r.h + 'px');
        var moved = window.scrollX || window.scrollY || root.scrollTop || (document.body && document.body.scrollTop) || (vv && (vv.offsetTop || vv.offsetLeft || vv.pageTop || vv.pageLeft));
        if (moved) { window.scrollTo(0, 0); root.scrollTop = 0; if (document.body) document.body.scrollTop = 0; }
        if ((r.stale || moved) && nudges < 6) {                      // make the iPhone lay the page out again
          nudges++;
          var m = document.querySelector('meta[name=viewport]'), c = m && m.getAttribute('content');
          if (m) { m.setAttribute('content', c + ', height=device-height'); setTimeout(function(){ m.setAttribute('content', c); }, 60); }
        }
        var key = r.w + 'x' + r.h + (r.stale ? 's' : '') + (moved ? 'm' : '');
        if (key !== last) { last = key; setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 80); }   // the game re-fits its court
      } catch (e) {}
    }
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    settle();
    [0, 60, 150, 300, 600, 1000, 1600, 2500, 4000].forEach(function(ms){ setTimeout(settle, ms); });
    ['DOMContentLoaded', 'load', 'pageshow', 'resize', 'orientationchange', 'focus'].forEach(function(ev){ window.addEventListener(ev, function(){ settle(); setTimeout(settle, 250); setTimeout(settle, 700); }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) { nudges = 0; settle(); setTimeout(settle, 250); setTimeout(settle, 700); } });
    if (window.visualViewport) { visualViewport.addEventListener('resize', settle); visualViewport.addEventListener('scroll', settle); }
  })();
</script>
<script>
  // No surprise updates: the app never reloads itself. A new version (only when we publish one) shows the
  // next time the app is closed and opened again, because the game loads fresh from the server at launch.
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).catch(() => {}));
</script>
<title>Retro Boxing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --blue:#2c2670; --blue-d:#231e5c; --blue-dd:#19154a; --navy:#0b0926;
  --white:#ffffff; --yellow:#ffd23f; --red:#e24b3b; --green:#44c45d; --sky:#4db8ff; --muted:#d8d4ff;
  --px:"Silkscreen","Courier New",monospace;
  --numf:"Roboto Mono",ui-monospace,Consolas,monospace;
  --body:"Pixelify Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cb:72px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--blue);color:var(--white);height:100%}
body{margin:0;font:15px/1.3 var(--body);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#ui{max-width:980px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-block:10px 16px;min-height:100%}

/* --- chrome --- */
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin-bottom:10px}
.bar>:last-child{justify-self:end}
.box{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:4px 10px;font-family:var(--px);font-weight:700;font-size:14px;white-space:nowrap}
.title{font-family:var(--px);font-weight:700;font-size:clamp(18px,3.4vw,28px);text-align:center;text-transform:uppercase;line-height:1.05;text-shadow:0 3px 0 var(--navy)}
.btn{font-family:var(--px);font-weight:700;text-transform:uppercase;border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:9px 14px;font-size:14px;letter-spacing:.03em;box-shadow:0 4px 0 var(--navy)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.btn.go{background:var(--yellow);color:#241a00;border-color:#fff3b8}
.btn.red{background:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px;border-width:2px}
.btn:disabled{opacity:.4;pointer-events:none}
.panel{border:3px solid var(--white);border-radius:6px;background:var(--blue-d);padding:10px 12px}
.label{font-family:var(--px);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:10px}
.muted{color:var(--muted)}
.yellow{color:var(--yellow)} .good{color:#7dff95} .bad{color:#ffb3aa}
.num{font-family:var(--numf);font-variant-numeric:tabular-nums;font-weight:700}
.px{font-family:var(--px)}
img.pt{image-rendering:pixelated;display:block}

/* --- title --- */
.logo{font-family:var(--px);font-weight:700;font-size:clamp(34px,7vw,64px);text-align:center;line-height:1;margin:18px 0 4px;text-shadow:0 5px 0 var(--navy)}
.logo b{color:var(--yellow)}
.sub{text-align:center;font-family:var(--px);font-size:12px;color:var(--muted);margin-bottom:18px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.slot{border:3px solid var(--white);border-radius:6px;background:var(--blue-d);padding:10px;text-align:center;box-shadow:0 4px 0 var(--navy);display:grid;justify-items:center;gap:4px;position:relative;min-height:150px;align-content:center}
.slot:active{transform:translateY(2px)}
.slot .nm{font-family:var(--px);font-size:14px}
.slot .del{position:absolute;right:6px;top:6px}

/* --- create --- */
.create{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px}
.preview{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);display:grid;place-items:center;padding:6px}
.field{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:8px}
.field input{width:100%;background:var(--navy);color:#fff;border:3px solid var(--white);border-radius:6px;padding:6px 8px;font-family:var(--px);font-size:14px;text-transform:uppercase}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border:3px solid rgba(255,255,255,.35);border-radius:6px;padding:0}
.sw button.on{border-color:var(--yellow);box-shadow:0 0 0 2px var(--navy)}

/* --- hub --- */
.hub{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;min-height:calc(100vh - 80px);min-height:calc(100dvh - 80px)}
.hub>.panel{display:grid;align-content:space-between}
.me{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.me .face{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);overflow:hidden}
.me .face img{width:100%;height:auto}
.me h2{font-family:var(--px);font-size:20px;margin:0;line-height:1.05}
.nick{font-family:var(--px);font-size:11px;color:var(--yellow)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:6px;font-size:14px}
.facts span{color:var(--muted)}
.belt{margin-top:8px;font-family:var(--px);font-size:12px;color:#241a00;background:var(--yellow);border-radius:4px;padding:3px 6px;text-align:center}
.rats{display:grid;gap:7px;margin-top:10px}
.rat{display:grid;grid-template-columns:84px minmax(0,1fr) 34px;align-items:center;gap:8px}
.rat b{font-family:var(--numf);font-size:15px;text-align:right}
.menu{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.4fr 1fr 1fr auto;gap:10px}
.menu .btn{padding:14px 6px}
.menu .wide{grid-column:1/-1}
.nextup{font-size:13px;color:var(--muted);text-align:center;margin-top:2px}

/* --- offers --- */
.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.offer{border:3px solid var(--white);border-radius:6px;background:var(--blue-d);padding:0;overflow:hidden;box-shadow:0 4px 0 var(--navy);text-align:center}
.offer:active{transform:translateY(2px)}
.offer .top{background:var(--blue-dd);display:flex;justify-content:center;padding-top:4px;position:relative}
.offer .rk{position:absolute;left:6px;top:5px;font-family:var(--numf);font-weight:700;font-size:14px}
.offer .tag{position:absolute;right:6px;top:6px;font-family:var(--px);font-size:9px;background:rgba(0,0,0,.35);border-radius:3px;padding:1px 4px}
.offer .bot{border-top:3px solid var(--white);padding:6px 6px 8px}
.offer .nm{font-family:var(--px);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offer .ln{display:flex;justify-content:space-between;font-size:13px;margin-top:2px}
.offer .ln span{color:var(--muted)}
.offer.title{border-color:var(--yellow)}
.offer.title .rk{color:var(--yellow)}

/* --- tale of the tape --- */
.tape{display:grid;grid-template-columns:130px minmax(0,1fr) 130px;gap:12px;align-items:center}
.tape .side{text-align:center}
.tape .side .face{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);display:flex;justify-content:center;overflow:hidden}
.tape .side .nm{font-family:var(--px);font-size:13px;margin-top:4px}
.tt{display:grid;grid-template-columns:44px minmax(0,1fr) 70px minmax(0,1fr) 44px;align-items:center;gap:6px;margin-bottom:6px}
.tt .v{font-family:var(--numf);font-weight:700;font-size:14px}
.tt .v.r{text-align:right}
.tt .k{font-family:var(--px);font-size:10px;text-align:center;color:var(--muted)}
.tt .bl{height:10px;background:var(--navy);border-radius:2px;overflow:hidden;display:flex;justify-content:flex-end}
.tt .br{height:10px;background:var(--navy);border-radius:2px;overflow:hidden}
.tt i{display:block;height:100%}
.tline{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-top:2px solid rgba(255,255,255,.12)}
.tline span:nth-child(2){font-family:var(--px);font-size:10px;color:var(--muted);align-self:center}

/* --- training --- */
.trow{display:grid;grid-template-columns:96px minmax(0,1fr) 40px auto auto;align-items:center;gap:8px;margin-bottom:6px}
.trow .nm{font-family:var(--px);font-size:13px}
.trow .ds{font-size:12px;color:var(--muted);grid-column:1/-1;margin:-4px 0 4px}
.hbar{height:14px;background:var(--navy);border-radius:2px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:2px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--px);font-size:10px;color:var(--muted);text-align:right;padding:4px;font-weight:400}
td{padding:4px;text-align:right;border-top:2px solid rgba(255,255,255,.13)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr.meRow td{color:var(--yellow)}
tr.champ td{color:#fff3b8}

/* --- result --- */
.res{text-align:center;display:grid;gap:8px;justify-items:center;padding-top:8px}
.res h1{font-family:var(--px);font-size:clamp(34px,7vw,58px);margin:0;line-height:1;text-shadow:0 5px 0 var(--navy)}
.res .how{font-family:var(--px);font-size:14px;color:var(--muted)}
.res .lines{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:16px;margin:6px 0}
.res .lines span{color:var(--muted);text-align:right}
.res .lines b{text-align:left}

/* --- fight --- */
#game{position:fixed;inset:0;background:var(--navy);touch-action:none;overflow:hidden}
#game[hidden]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:start;padding:8px max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
.hb{max-width:300px;width:100%}
.hb.r{justify-self:end;text-align:right}
.hn{font-family:var(--px);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #000;margin-bottom:2px}
.hpbar{height:13px;border:2px solid #fff;background:#000;display:flex}
.hpbar i{display:block;height:100%;background:var(--yellow);transition:width .15s}
.hpbar i.low{background:var(--red)}
.stbar{height:7px;border:2px solid #fff;background:#000;margin-top:3px;display:flex}
.stbar i{display:block;height:100%;background:var(--sky)}
.hb.r .hpbar,.hb.r .stbar{justify-content:flex-end}
.kds{font-family:var(--px);font-size:10px;color:var(--yellow);margin-top:2px;min-height:12px}
.clock{text-align:center;font-family:var(--px);text-shadow:0 2px 0 #000;padding-top:2px}
.clock .rd{font-size:11px;color:var(--muted)}
.clock .t{font-family:var(--numf);font-size:20px;font-weight:700}
#pauseBtn{position:absolute;top:8px;left:50%;transform:translateX(-50%);margin-top:44px;pointer-events:auto;width:34px;height:28px;padding:0;font-size:11px}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--px);font-weight:700;font-size:clamp(30px,8vh,64px);text-shadow:0 4px 0 #000;pointer-events:none;color:#fff}
#banner.y{color:var(--yellow)}
#banner.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}100%{transform:scale(1);opacity:1}}
#pops{position:absolute;inset:0;pointer-events:none}
.fx{position:absolute;transform:translate(-50%,-100%);font-family:var(--px);font-weight:700;font-size:15px;text-shadow:0 2px 0 #000;white-space:nowrap;animation:rise .8s ease-out forwards}
.fx.y{color:var(--yellow)} .fx.r{color:#ff7a6b} .fx.b{color:var(--sky)}
@keyframes rise{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-26px}}
.htbar{display:flex;align-items:center;gap:4px;margin-top:3px}
.htbar span{color:#ff5e6e;font-size:12px;line-height:1;text-shadow:0 1px 0 #000}
.htbar div{flex:1;max-width:120px;height:7px;border:2px solid #fff;background:#000;display:flex}
.htbar i{display:block;height:100%;background:#ff5e6e}
.htbar.on i{background:var(--yellow)} .htbar.on span{color:var(--yellow)}
#eye{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 70% 80% at 62% 50%,transparent 45%,rgba(40,10,50,.95) 100%)}
.ctrls{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;font-size:14px}
.ctrls b{font-family:var(--px);font-size:12px;color:var(--yellow)}
#getup{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);text-align:center;pointer-events:none;font-family:var(--px);font-size:16px;text-shadow:0 2px 0 #000}
#getup .m{width:220px;height:16px;border:3px solid #fff;background:#000;margin:6px auto 0}
#getup .m i{display:block;height:100%;background:var(--green)}
#over{position:absolute;inset:0;background:rgba(11,9,38,.72);display:grid;place-items:center;padding:12px}
#over[hidden]{display:none}
#over .panel{min-width:min(420px,92vw);text-align:center;display:grid;gap:8px}
#over h2{font-family:var(--px);font-size:22px;margin:0}
#over table td,#over table th{text-align:center}
#over table td:first-child{text-align:left}
.nohover small{display:none}
#rotate{display:none;position:fixed;inset:0;background:var(--blue);z-index:50;align-items:center;justify-content:center;text-align:center;font-family:var(--px);font-size:18px;padding:30px}
@media (orientation:portrait) and (max-width:700px){ #rotate{display:flex} }

/* --- phone landscape --- */
@media (max-height:500px){
  #ui{padding-block:6px 8px}
  .bar{margin-bottom:6px}
  .title{font-size:20px}
  .btn{padding:7px 12px;font-size:13px}
  .menu .btn{padding:10px 6px}
  .menu{gap:8px}
  .panel{padding:8px 10px}
  .logo{margin:6px 0 2px;font-size:44px}
  .sub{margin-bottom:10px}
  .slot{min-height:calc(100dvh - 130px);padding:8px}
  .me{grid-template-columns:130px minmax(0,1fr)}
  .hub{min-height:calc(100vh - 62px);min-height:calc(100dvh - 62px)}
  .me h2{font-size:17px}
  .facts{font-size:13px}
  .rats{margin-top:8px;gap:6px}
  .rat b{font-size:14px}
  .create{grid-template-columns:140px minmax(0,1fr)}
  .field{margin-bottom:5px}
  .sw button{width:26px;height:26px}
  .tape{grid-template-columns:110px minmax(0,1fr) 110px}
  .tt{margin-bottom:3px}
  .tline{padding:2px 0;font-size:13px}
  .trow{margin-bottom:3px}
  .offer .ln{font-size:12px}
  td{padding:3px 4px}
  .hn{font-size:11px}
  .clock .t{font-size:17px}
  #pauseBtn{margin-top:38px}
}
</style>

<div id="ui"></div>
<div id="game" hidden>
  <canvas id="cv"></canvas>
  <div id="eye"></div>
  <div id="hud">
    <div class="hb"><div class="hn" id="n0"></div><div class="hpbar"><i id="hp0"></i></div><div class="stbar"><i id="st0"></i></div><div class="htbar" id="htw"><span>&#9829;</span><div><i id="ht"></i></div></div><div class="kds" id="kd0"></div></div>
    <div class="clock"><div class="rd" id="rd">ROUND 1</div><div class="t" id="clk">3:00</div></div>
    <div class="hb r"><div class="hn" id="n1"></div><div class="hpbar"><i id="hp1"></i></div><div class="stbar"><i id="st1"></i></div><div class="kds" id="kd1"></div></div>
  </div>
  <button class="btn sm" id="pauseBtn" aria-label="Pause">II</button>
  <div id="pops"></div>
  <div id="banner"></div>
  <div id="getup" hidden></div>
  <div id="over" hidden></div>
</div>
<div id="rotate">Turn your phone sideways</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t;
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ================= saves ================= */
let G = null, SLOT = null, screen = 'title', sel = null, armed = null, SOUND = true;
const slotKey = n => 'retroboxing.slot' + n;
function slotRaw(n){ try { return localStorage.getItem(slotKey(n)); } catch { return null; } }
function slotLoad(n){ try { return JSON.parse(slotRaw(n)); } catch { return null; } }

/* ================= the world ================= */
function genLook(){
  return { skin:pick(SKINS), hair:Math.random() < .2 ? 'none' : pick(HAIRS.slice(0, 5)), trunks:pick(KITS), gloves:pick(GLOVES) };
}
function genFighter(base, age){
  const style = pick(Object.keys(STYLES)), m = STYLES[style].mod, rat = {};
  for (const k of RK) rat[k] = clamp(Math.round(base + m[k] + rnd(-5, 5)), 15, 99);
  const f = { id:'f' + (G.nextId++), name:pick(FIRST) + ' ' + pick(LAST), nick:Math.random() < .6 ? pick(NICK) : '', style, rat,
    age:age ?? ri(21, 33), w:0, l:0, d:0, ko:0, look:genLook() };
  G.fighters[f.id] = f;
  return f;
}
const skillOf = f => clamp((ovr(f) - 28) / 60, 0, 1);       // how well the computer reads you
function newCareer(name, nick, look){
  G = { v:1, nextId:1, week:0, cash:500, fighters:{}, ladder:[], pool:[], offers:null, log:[], best:null, nrWins:0, titles:0, defenses:0, over:false };
  G.fighters.me = { id:'me', me:true, name, nick, style:'you', rat:{ pow:40, spd:40, sta:40, chin:40 }, age:21, w:0, l:0, d:0, ko:0, look };
  for (let i = 0; i <= 30; i++) {                             // 0 is the champion, 1-30 the rankings
    const f = genFighter(87 - i * 1.5);
    f.w = ri(9, 15) + Math.round((30 - i) * .6); f.l = i === 0 ? ri(0, 1) : ri(0, 4) + (i > 15 ? ri(0, 3) : 0); f.d = Math.random() < .3 ? 1 : 0; f.ko = Math.round(f.w * rnd(.4, .75));
    G.ladder.push(f.id);
  }
  for (let i = 0; i < 12; i++) { const f = genFighter(rnd(30, 40)); f.w = ri(2, 9); f.l = ri(2, 10); f.ko = Math.round(f.w * rnd(.3, .6)); G.pool.push(f.id); }
}
const rankOf = id => G.ladder.indexOf(id);
const rankLabel = id => { const i = rankOf(id); return i < 0 ? 'Unranked' : i === 0 ? 'Champion' : '#' + i; };
const rankShort = id => { const i = rankOf(id); return i < 0 ? 'NR' : i === 0 ? 'C' : '#' + i; };

// the winner takes the loser's spot if he was ranked below him; everyone in between moves down one
function beat(win, lose){
  const L = G.ladder, li = L.indexOf(lose); let wi = L.indexOf(win);
  if (li < 0 || (wi >= 0 && wi < li)) return;
  if (wi >= 0) L.splice(wi, 1);
  G.pool = G.pool.filter(x => x !== win);
  L.splice(li, 0, win);
  while (L.length > 31) { const out = L.pop(); if (out !== 'me') G.pool.push(out); }
}
function dropMe(n){
  const L = G.ladder, i = L.indexOf('me'); if (i < 0) return;
  L.splice(i, 1); L.splice(Math.min(L.length, i + n), 0, 'me');
}
function simBout(a, b){
  const A = G.fighters[a], B = G.fighters[b]; if (!A || !B) return;
  const p = 1 / (1 + Math.exp(-(ovr(A) - ovr(B)) / 5));
  if (Math.random() < .06) { A.d++; B.d++; return; }
  const [W, L] = Math.random() < p ? [A, B] : [B, A];
  W.w++; L.l++; if (Math.random() < .5) W.ko++;
  beat(W.id, L.id);
}
function worldSim(){
  const L = G.ladder;
  for (let k = 0; k < 4; k++) {
    const i = ri(1, 30), j = Math.max(0, i - ri(1, 3));
    if (L[i] === 'me' || L[j] === 'me' || (j === 0 && Math.random() < .6)) continue;
    simBout(L[i], L[j]);
  }
  if (Math.random() < .6) simBout(pick(G.pool), L[ri(25, 30)]);
  for (const f of Object.values(G.fighters)) {
    if (f.me) continue;
    f.age += .3;
    for (const k of RK) f.rat[k] = clamp(f.rat[k] + (f.age < 27 ? rnd(0, .7) : f.age > 32 ? -rnd(0, .9) : 0), 15, 99);
  }
  // old fighters retire; a new prospect joins the unranked pool for each
  for (const f of Object.values(G.fighters)) {
    if (f.me || f.age < 36 || Math.random() > .3 || (G.offers || []).some(o => o.id === f.id)) continue;
    G.ladder = G.ladder.filter(x => x !== f.id); G.pool = G.pool.filter(x => x !== f.id); delete G.fighters[f.id];
    const n = genFighter(rnd(32, 44), ri(20, 24)); n.w = ri(3, 8); n.l = ri(0, 2); n.ko = Math.round(n.w * .6); G.pool.push(n.id);
  }
  while (G.ladder.length < 31 && G.pool.length) {           // fill a gap in the rankings with the best of the pool
    G.pool.sort((a, b) => ovr(G.fighters[b]) - ovr(G.fighters[a]));
    G.ladder.push(G.pool.shift());
  }
  while (G.pool.length < 10) { const n = genFighter(rnd(30, 40)); n.w = ri(2, 9); n.l = ri(2, 10); G.pool.push(n.id); }
}

/* ================= fight offers ================= */
function roundsFor(id, title){ if (title) return 10; const i = rankOf(id); return i < 0 ? 3 : i > 20 ? 4 : i > 10 ? 6 : 8; }
function purseFor(id, title){
  const i = rankOf(id);
  if (i < 0) return ri(5, 9) * 100;
  const base = 300 + 60 * (31 - i) ** 2;
  return Math.round(base * (title ? 2.2 : 1) / 100) * 100;
}
function makeOffers(){
  const L = G.ladder, i = L.indexOf('me'), o = [];
  const add = (id, title) => { if (id && id !== 'me' && !o.some(x => x.id === id)) o.push({ id, title:!!title }); };
  if (i < 0) { shuffle([...G.pool]).slice(0, 2).forEach(id => add(id)); add(L[ri(27, 30)]); }
  else if (i === 0) { shuffle([1, 2, 3, 4, 5, 6]).forEach(k => { if (o.length < 3) add(L[k], true); }); }
  else if (i === 1) { add(L[0], true); add(L[ri(2, 4)]); add(L[ri(5, 8)]); }
  else {
    add(L[Math.min(L.length - 1, i + ri(1, 3))]);
    add(L[Math.max(1, i - ri(1, 2))]);
    add(L[Math.max(1, i - ri(3, 5))]);
  }
  let guard = 0;
  while (o.length < 3 && guard++ < 40) add(pick(G.pool));
  G.offers = o.map(x => ({ ...x, purse:purseFor(x.id, x.title), rounds:roundsFor(x.id, x.title) }));
  // order: easiest first
  G.offers.sort((a, b) => ovr(G.fighters[a.id]) - ovr(G.fighters[b.id]));
}

/* ================= training ================= */
const priceOf = v => Math.max(50, Math.round(120 * 1.06 ** (v - 40) / 10) * 10);
function train(k, n){
  const me = G.fighters.me;
  for (let i = 0; i < n; i++) {
    if (me.rat[k] >= 99) break;
    const p = priceOf(me.rat[k]); if (G.cash < p) break;
    G.cash -= p; me.rat[k]++;
  }
  save(); render();
}

/* ================= results ================= */
function applyResult(R){
  const me = G.fighters.me, o = G.fighters[R.opp], wasRank = rankOf('me'), wasChamp = wasRank === 0;
  let pay;
  if (R.draw) { me.d++; o.d++; pay = Math.round(R.purse * .75); }
  else if (R.win) {
    me.w++; o.l++; if (R.ko) me.ko++; pay = R.purse;
    beat('me', o.id);
    // unranked: two wins over unranked fighters get you in at #30
    if (rankOf('me') < 0 && rankOf(o.id) < 0 && ++G.nrWins >= 2) { G.ladder.push('me'); while (G.ladder.length > 31) { const out = G.ladder.splice(G.ladder.length - 2, 1)[0]; G.pool.push(out); } }
    if (R.title) { if (wasChamp) G.defenses++; else G.titles++; }
  } else {
    me.l++; o.w++; if (R.ko) o.ko++; pay = Math.round(R.purse * .5);
    const oi = rankOf(o.id);
    if (oi >= 0 && wasRank >= 0 && oi < wasRank) dropMe(ri(1, 3)); else beat(o.id, 'me');
  }
  G.cash += pay;
  const nowRank = rankOf('me');
  if (nowRank >= 0 && (G.best === null || nowRank < G.best)) G.best = nowRank;
  // birthday: from 31 on, the body starts to slow down
  const before = Math.floor(me.age); me.age = +(me.age + .3).toFixed(2);
  let aged = null;
  if (Math.floor(me.age) > before && me.age >= 31) {
    aged = {};
    for (const k of RK) { const d = k === 'spd' ? ri(1, 3) : k === 'pow' ? ri(0, 1) : ri(0, 2); me.rat[k] = Math.max(15, me.rat[k] - d); aged[k] = d; }
  }
  G.log.unshift({ wk:G.week, opp:o.name, oppRank:R.oppRank, res:R.draw ? 'D' : R.win ? 'W' : 'L', how:R.how, rd:R.rd, title:R.title });
  G.week++;
  worldSim();
  G.offers = null;
  G.last = { ...R, pay, wasRank, nowRank:rankOf('me'), aged, age:Math.floor(me.age) };
  if (me.age >= 40) G.over = true;
  save();
}

/* ================= sprites ================= */
// pixel art drawn from rectangles on a small grid: big flat pixels, no outlines (Retro Bowl style)
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => clamp(Math.round(v * f), 0, 255));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
function mix(a, b, t){
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const c = [16, 8, 0].map(s => Math.round(lerp((A >> s) & 255, (B >> s) & 255, clamp(t, 0, 1))));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
// glove (fg/bg) and elbow (fe/be) spots for the front and back arm, body lean, crouch, head offset
const POSE = {

  duck:  { lean:3,  cr:10, hx:1,  hy:1,  fg:[11,-43], fe:[7,-33],  bg:[7,-45],  be:[2,-33] },
  hurt:  { lean:-4, cr:1,  hx:-3, hy:-1, fg:[9,-39],  fe:[6,-31],  bg:[3,-41],  be:[-1,-31] },

const PK = ['lean','cr','hx','hy'], PV = ['fg','fe','bg','be'];
const copyPose = p => ({ lean:p.lean, cr:p.cr, hx:p.hx, hy:p.hy, fg:[...p.fg], fe:[...p.fe], bg:[...p.bg], be:[...p.be] });
function blendPose(a, b, t){
  const o = {};
  for (const k of PK) o[k] = lerp(a[k], b[k], t);
  for (const k of PV) o[k] = [lerp(a[k][0], b[k][0], t), lerp(a[k][1], b[k][1], t)];
  return o;
}
// draws a boxer facing `dir` (1 right, -1 left) with his feet at (ox, gy).
// o: { walk (step phase), swell 0-1, cut 0-3, body (0-1 share of health lost to the body), rage }
function drawBoxer(g, ox, gy, dir, p, look, o = {}){
  const skin = look.skin, skinB = shade(skin, .82), hair = look.hair, trunks = look.trunks;
  const glove = o.rage ? mix(look.gloves, '#ffd23f', .55) : look.gloves, gloveB = shade(glove, .78);
  const band = (trunks === '#f4f4f4' || trunks === '#ffd23f') ? '#1d1d1d' : '#f4f4f4';
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(dir > 0 ? ox + x : ox - x - w), Math.round(gy + y), w, h); };
  const B = (x0, y0, x1, y1, w, c) => {
    const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
    for (let i = 0; i <= n; i++) { const t = i / n; R(x0 + (x1 - x0) * t - w / 2, y0 + (y1 - y0) * t - w / 2, w, w, c); }
  };
  const L = p.lean, C = p.cr, step = o.walk ? Math.sin(o.walk) * 2 : 0;
  const arm = (s, e, gl, col, gcol) => {
    B(s[0], s[1], e[0] + L, e[1] + C, 4, col);
    B(e[0] + L, e[1] + C, gl[0] + L, gl[1] + C, 4, col);
    R(gl[0] + L - 3.5, gl[1] + C - 3.5, 7, 7, gcol);
    R(gl[0] + L - 3.5, gl[1] + C + 2.5, 7, 1, shade(gcol, .8));
  };
  R(-13, -1, 26, 2, 'rgba(0,0,0,.28)');                                   // shadow
  arm([-4 + L, -38 + C], p.be, p.bg, skinB, gloveB);                      // back arm, behind the body
  B(-3, -16 + C, -7 - step, -3, 4, skinB);                                 // back leg
  B(3, -16 + C, 7 + step, -3, 4, skin);                                    // front leg
  R(-10 - step, -3, 6, 3, '#f2f2f2'); R(-10 - step, -1, 6, 1, '#9a9a9a');  // shoes
  R(4 + step, -3, 6, 3, '#f2f2f2'); R(4 + step, -1, 6, 1, '#9a9a9a');
  R(-7 + L * .3, -26 + C, 14, 12, trunks);                                 // trunks
  R(-7 + L * .3, -26 + C, 14, 2, band);
  R(-6 + L * .5, -33 + C, 12, 8, skin);                                    // body
  R(-7 + L, -40 + C, 14, 8, skin);
  if (o.body > .12) R(1 + L * .5, -31 + C, 4, 3, mix(skin, '#b0404a', .25 + o.body));          // bruised ribs
  if (o.body > .3) R(-3 + L * .5, -29 + C, 3, 2, mix(skin, '#8a2f5a', .2 + o.body));
  R(-2 + L * 1.1, -43 + C, 4, 3, skin);                                    // neck
  const hx = L * 1.15 + p.hx, hy = C + p.hy, sw = o.swell || 0;
  R(-5 + hx, -53 + hy, 10, 10, skin);                                      // head
  if (hair !== 'none') { R(-5 + hx, -53 + hy, 10, 3, hair); R(-5 + hx, -50 + hy, 3, 3, hair); }
  R(-1 + hx, -48 + hy, 2, 2, skinB);                                       // ear
  // the eye on our side swells shut as the head shots pile up
  if (sw > .12) R(1 + hx, -51 + hy, 4, 3, mix(skin, '#7a3f86', sw * .9));
  if (sw > .4) R(1 + hx, -52 + hy, 5, 5, mix(skin, '#6a2f7a', sw * .85));
  if (sw > .7) R(5 + hx, -51 + hy, 1, 3, mix(skin, '#5a2068', sw * .8));    // puffs out past the face
  R(2 + hx, -50 + hy, 3, 1, sw > .4 ? mix(skin, '#5a2068', sw) : hair !== 'none' ? hair : shade(skin, .6));     // brow
  if (sw > .7) R(2 + hx, -48 + hy, 2, 1, '#141414');                       // eye shut to a slit
  else R(3 + hx, -49 + hy, 1, sw > .45 ? 1 : 2, '#141414');                // eye
  if (o.cut >= 1) R(4 + hx, -51 + hy, 1, 2, '#c41e1e');                    // cut over the eye
  if (o.cut >= 2) { R(4 + hx, -49 + hy, 1, 3, '#c41e1e'); R(3 + hx, -46 + hy, 1, 2, '#a01818'); }
  if (o.cut >= 3) { R(2 + hx, -45 + hy, 2, 1, '#a01818'); R(2 + L, -37 + C, 1, 2, '#a01818'); R(-1 + L, -34 + C, 1, 1, '#a01818'); }
  arm([4 + L, -38 + C], p.fe, p.fg, skin, glove);                          // front arm
}
// flat on his back, head away from the other man
function drawDown(g, ox, gy, dir, look, o = {}){
  const skin = look.skin, hair = look.hair;
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(dir > 0 ? ox + x : ox - x - w), Math.round(gy + y), w, h); };
  R(-38, -1, 52, 2, 'rgba(0,0,0,.28)');

        <div class="field"><span class="label">Nickname</span><input id="nkIn" maxlength="14" value="${esc(d.nick)}" placeholder="optional" style="text-transform:none"></div>
        <div class="field"><span class="label">Skin</span>${sw('skin', SKINS)}</div>
        <div class="field"><span class="label">Hair</span>${sw('hair', HAIRS)}</div>
        <div class="field"><span class="label">Trunks</span>${sw('trunks', KITS)}</div>
        <div class="field"><span class="label">Gloves</span>${sw('gloves', GLOVES)}</div>
        <div class="row" style="justify-content:flex-end"><button class="btn go" data-a="start">Start career</button></div>
      </div></div>`;
  },
  hub(){
    const me = G.fighters.me, i = rankOf('me');
    if (G.over) return VIEWS.over();
    const rats = RK.map(k => `<div class="rat"><span class="label">${RNAME[k]}</span><div class="hbar"><i style="width:${me.rat[k]}%;background:${barCol(me.rat[k])}"></i></div><b>${me.rat[k]}</b></div>`).join('');
    return `${bar(me.nick ? '&ldquo;' + esc(me.nick) + '&rdquo;' : 'Retro Boxing', '<button class="btn sm" data-a="title">Menu</button>')}
      <div class="hub"><div class="panel"><div class="me"><div class="face">${face(me, 150)}</div><div>
        <h2>${esc(me.name)}</h2>
        <div class="facts"><span>Record</span><b class="num">${rec(me)} (${me.ko} KO)</b><span>Rank</span><b class="num">${rankLabel('me')}</b><span>Age</span><b class="num">${Math.floor(me.age)}</b></div>
        ${i === 0 ? `<div class="belt">WORLD CHAMPION${G.defenses ? ' &middot; ' + G.defenses + ' defense' + (G.defenses > 1 ? 's' : '') : ''}</div>` : ''}
      </div></div><div class="rats">${rats}</div></div>
      <div class="menu"><button class="btn go wide" data-a="offers">Next fight</button>
        <button class="btn" data-a="train">Training</button><button class="btn" data-a="rankings">Rankings</button>
        <button class="btn" data-a="log">Fight log</button><button class="btn" data-a="retire">${armed === 'retire' ? 'Sure? Retire' : 'Retire'}</button>
        <div class="nextup wide">${i < 0 ? `Win ${Math.max(1, 2 - (G.nrWins || 0))} more to get ranked, or beat a ranked man.` : i === 0 ? 'Defend your belt.' : i === 1 ? 'You are the number one contender: title shot ready.' : 'Beat a fighter ranked above you to take his spot.'}</div>
      </div></div>`;
  },
  offers(){
    if (!G.offers) { makeOffers(); save(); }
    const cards = G.offers.map((o, k) => {
      const f = G.fighters[o.id], S = STYLES[f.style];
      return `<button class="offer ${o.title ? 'title' : ''}" data-a="pickoff" data-k="${k}">
        <div class="top"><span class="rk">${rankShort(o.id)}</span><span class="tag">${S.name}</span>${face(f, 104)}</div>
        <div class="bot"><div class="nm">${esc(f.name)}</div>
          <div class="ln"><span>Record</span><b class="num">${rec(f)}</b></div>
          <div class="ln"><span>Overall</span><b class="num">${ovr(f)}</b></div>
          <div class="ln"><span>Rounds</span><b class="num">${o.rounds}</b></div>
          <div class="ln"><span>Purse</span><b class="num yellow">${money(o.purse)}</b></div>
          ${o.title ? '<div class="label yellow" style="margin-top:3px">Title fight</div>' : ''}</div></button>`;
    }).join('');
    return `${bar('Pick a fight')}<div class="offers">${cards}</div>`;
  },
  tape(){
    const o = G.offers[sel], me = G.fighters.me, f = G.fighters[o.id];
    const row = k => `<div class="tt"><span class="v num">${me.rat[k]}</span><div class="bl"><i style="width:${me.rat[k]}%;background:${barCol(me.rat[k])}"></i></div><span class="k">${RNAME[k]}</span><div class="br"><i style="width:${f.rat[k]}%;background:${barCol(f.rat[k])}"></i></div><span class="v r num">${f.rat[k]}</span></div>`;
    const line = (a, k, b) => `<div class="tline"><b class="num">${a}</b><span>${k}</span><b class="num">${b}</b></div>`;
    return `${bar(o.title ? 'Title fight' : 'Tale of the tape', '<button class="btn sm" data-a="offers">Back</button>')}
      <div class="tape"><div class="side"><div class="face">${face(me, 124)}</div><div class="nm">${esc(me.name)}</div></div>
      <div class="panel">${RK.map(row).join('')}
        ${line(rec(me), 'Record', rec(f))}${line(rankShort('me'), 'Rank', rankShort(o.id))}${line(Math.floor(me.age), 'Age', Math.floor(f.age))}
        <div class="row between" style="margin-top:8px"><span class="muted">${o.rounds} rounds &middot; purse <b class="yellow num">${money(o.purse)}</b></span><button class="btn go" data-a="fight">Fight!</button></div></div>
      <div class="side"><div class="face" style="transform:scaleX(-1)">${face(f, 124)}</div><div class="nm">${esc(f.name)}</div><div class="label">${f.nick ? '&ldquo;' + esc(f.nick) + '&rdquo; &middot; ' : ''}${STYLES[f.style].name}</div></div></div>`;
  },
  train(){
    const me = G.fighters.me;
    const rows = RK.map(k => {
      const v = me.rat[k], p = priceOf(v), max = v >= 99;
      let n5 = 0, c5 = 0; for (let i = 0; i < 5 && v + i < 99; i++) { c5 += priceOf(v + i); n5++; }
      return `<div class="trow"><span class="nm">${RNAME[k]}</span><div class="hbar"><i style="width:${v}%;background:${barCol(v)}"></i></div><b class="num">${v}</b>
        <button class="btn sm" data-a="tr" data-k="${k}" data-n="1" ${max || G.cash < p ? 'disabled' : ''}>+1 <span class="num">${money(p)}</span></button>
        <button class="btn sm" data-a="tr" data-k="${k}" data-n="5" ${max || G.cash < c5 ? 'disabled' : ''}>+${n5 || 5} <span class="num">${money(c5)}</span></button>
        <div class="ds">${RDESC[k]}</div></div>`;
    }).join('');
    return `${bar('Training')}<div class="panel">${rows}<div class="muted" style="font-size:12px">Every point costs a bit more than the last. From age 31 you lose a little each birthday.</div></div>`;
  },
  rankings(){
    const rows = G.ladder.map((id, i) => {
      const f = G.fighters[id];
      return `<tr class="${id === 'me' ? 'meRow' : i === 0 ? 'champ' : ''}"><td class="num">${i === 0 ? 'C' : i}</td><td class="l">${esc(f.name)}${i === 0 ? ' &#9733;' : ''}</td><td class="l muted">${f.me ? 'You' : STYLES[f.style].name}</td><td class="num">${rec(f)}</td><td class="num">${f.ko}</td><td class="num">${ovr(f)}</td><td class="num">${Math.floor(f.age)}</td></tr>`;
    }).join('');
    const out = rankOf('me') < 0 ? `<tr class="meRow"><td>NR</td><td class="l">${esc(G.fighters.me.name)}</td><td class="l muted">You</td><td class="num">${rec(G.fighters.me)}</td><td class="num">${G.fighters.me.ko}</td><td class="num">${ovr(G.fighters.me)}</td><td class="num">${Math.floor(G.fighters.me.age)}</td></tr>` : '';
    return `${bar('Rankings')}<div class="panel"><table><tr><th>#</th><th class="l">Boxer</th><th class="l">Style</th><th>Record</th><th>KO</th><th>OVR</th><th>Age</th></tr>${rows}${out}</table></div>`;
  },
  log(){
    const rows = G.log.map(l => `<tr><td class="${l.res === 'W' ? 'good' : l.res === 'L' ? 'bad' : ''}">${l.res}</td><td class="l">${esc(l.opp)} <span class="muted num">${l.oppRank}</span>${l.title ? ' <span class="yellow">&#9733;</span>' : ''}</td><td class="l">${HOW[l.how]}</td><td class="num">${l.rd}</td></tr>`).join('');
    return `${bar('Fight log')}<div class="panel">${G.log.length ? `<table><tr><th></th><th class="l">Opponent</th><th class="l">How</th><th>Rd</th></tr>${rows}</table>` : '<div class="muted">No fights yet.</div>'}</div>`;
  },
  result(){
    const R = G.last, me = G.fighters.me;
    const word = R.draw ? 'DRAW' : R.win ? 'YOU WIN' : 'YOU LOSE';
    const rk = i => i < 0 ? 'Unranked' : i === 0 ? 'Champion' : '#' + i;
    const aged = R.aged ? `<div class="bad" style="font-size:14px">Turned ${R.age}: ${RK.filter(k => R.aged[k]).map(k => RNAME[k] + ' -' + R.aged[k]).join(', ') || 'no change'}</div>` : '';
    const title = R.title && R.win ? `<div class="belt" style="padding:4px 14px">${R.wasRank === 0 ? 'TITLE DEFENDED' : 'NEW WORLD CHAMPION'}</div>` : '';
    return `<div class="res"><h1 class="${R.win ? 'yellow' : ''}">${word}</h1>
      <div class="how">${HOW[R.how]}${R.ko ? ' &middot; round ' + R.rd : ''}${R.totals ? ' &middot; ' + R.totals.map(t => t[0] + '-' + t[1]).join(', ') : ''}</div>${title}
      <div class="lines"><span>Record</span><b class="num">${rec(me)} (${me.ko} KO)</b><span>Purse</span><b class="num yellow">+${money(R.pay)}${R.win || R.draw ? '' : ' (loser\'s half)'}</b><span>Rank</span><b class="num">${rk(R.wasRank)} &rarr; ${rk(R.nowRank)}</b></div>
      ${aged}<button class="btn go" data-a="hub">Continue</button></div>`;
  },
  over(){
    const me = G.fighters.me;
    return `<div class="res"><h1>CAREER OVER</h1><div class="how">${esc(me.name)} hangs up the gloves at ${Math.floor(me.age)}</div>
      ${face(me, 110)}
      <div class="lines"><span>Record</span><b class="num">${rec(me)} (${me.ko} KO)</b><span>Best rank</span><b>${G.best === null ? 'Unranked' : G.best === 0 ? 'World champion' : '#' + G.best}</b><span>Title wins</span><b class="num">${G.titles}</b><span>Defenses</span><b class="num">${G.defenses}</b></div>
      <button class="btn go" data-a="title">Back to menu</button></div>`;
  },
};
ui.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, n = +b.dataset.n;
  if (a !== 'del' && a !== 'retire') armed = null;
  switch (a) {
    case 'title': SLOT = null; G = null; screen = 'title'; break;
    case 'newslot': SLOT = n; draft = { name:'', nick:'', look:{ skin:SKINS[1], hair:HAIRS[0], trunks:KITS[0], gloves:GLOVES[0] } }; screen = 'create'; break;
    case 'load': SLOT = n; G = slotLoad(n); screen = 'hub'; if (!G) { screen = 'title'; SLOT = null; } break;
    case 'del': e.stopPropagation(); if (armed === 'del' + n) { resetSlot(n); armed = null; } else armed = 'del' + n; break;
    case 'look': draft.look[b.dataset.k] = b.dataset.v; break;
    case 'start': { const nm = (draft.name || '').trim() || 'ROOKIE'; newCareer(nm, (draft.nick || '').trim(), { ...draft.look }); save(); screen = 'hub'; break; }
    case 'hub': screen = 'hub'; break;
    case 'offers': screen = 'offers'; break;
    case 'pickoff': sel = +b.dataset.k; screen = 'tape'; break;
    case 'fight': ac(); startFight(G.offers[sel]); return;
    case 'train': screen = 'train'; break;
    case 'tr': train(b.dataset.k, n); return;
    case 'rankings': screen = 'rankings'; break;
    case 'log': screen = 'log'; break;
    case 'retire': if (armed === 'retire') { armed = null; G.over = true; save(); } else armed = 'retire'; break;
  }
  render();
});
render();
})();
</script>
